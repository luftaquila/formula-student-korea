server:
  port: 8080
  baseURL: /files
  database: /home/filebrowser/data/database.db
  minSearchLength: 1
  sources:
    - path: /folder
      name: cloud

auth:
  methods:
    password:
      enabled: false
    proxy:
      enabled: true
      header: X-Forwarded-User
      createUser: true

userDefaults:
  locale: ko
  viewMode: list
  stickySidebar: true
  singleClick: false
  quickDownload: false
  permissions:
    admin: false
    modify: true
    # share=false: 기본적으로 공개(인증 불필요) 공유 링크 생성을 막는다. 이 파일저장소는
    # caddy forward_auth로 files.access 권한만 접근하는데, share 링크는 그 게이트를 우회해 링크만
    # 알면 누구나 받을 수 있으므로 기본 차단한다. 공유가 필요하면 true로 되돌린다.
    share: false
    create: true
    delete: true
    download: true
    realtime: true
    api: true

frontend:
  disableDefaultLinks: true
  disableNavButtons: false
  externalLinks:
    - text: "FSK Service Hub"
      url: "/"
  styling:
    customCSS: /home/filebrowser/custom.css
