name: Build Rover Pilot Image

on:
  push:
    branches: [main]
    paths:
      - 'course/rover/pilot/**'
      - '.github/workflows/rover-pilot-image.yml'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'OCI tag to publish (e.g. candidate, edge, vX.Y.Z).'
        required: false
        default: 'candidate'

permissions:
  contents: read
  packages: write

concurrency:
  group: rover-pilot-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fsk-rover-pilot

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python test deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
          python3 -m pip install -r course/rover/pilot/requirements.txt || true

      - name: Compile rover sources
        run: python3 -m compileall course/rover/pilot/pilot course/rover/pilot/test course/rover/pilot/launch

      - name: Run pilot pytest
        run: |
          cd course/rover/pilot
          python3 -m pytest test/ -q

  build:
    runs-on: ubuntu-24.04-arm
    needs: verify
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            channel="${{ inputs.release_channel }}"
          else
            channel="candidate"
          fi
          echo "tag=${IMAGE}:${channel}" >> "$GITHUB_OUTPUT"

      - name: Build and push pilot image
        uses: docker/build-push-action@v7
        with:
          context: course/rover/pilot
          file: course/rover/pilot/Containerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=rover-pilot
          cache-to: type=gha,scope=rover-pilot,mode=max
