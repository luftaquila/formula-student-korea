name: Build Rover Snap

on:
  push:
    # Branch pushes: gated by course/rover paths so doc-only changes elsewhere
    # don't rebuild the rover snap. Tags (v*) also trigger this flow; note that
    # GitHub's `paths` filter also applies to tag pushes, so tags placed on
    # non-course commits won't trigger — use workflow_dispatch for those.
    branches: [main]
    tags: ['v*']
    paths:
      - 'course/rover/**'
      - '.github/workflows/rover-snap.yml'
  pull_request:
    paths:
      - 'course/rover/**'
      - '.github/workflows/rover-snap.yml'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Snap channel to release to (edge | candidate | beta | stable). Use this for tag→edge promotion when the tagged commit is doc-only.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: rover-snap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python test deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
          python3 -m pip install -r course/rover/pilot/requirements.txt || true

      - name: Compile rover sources
        run: python3 -m compileall course/rover/pilot/pilot course/rover/pilot/test course/rover/pilot/launch

      - name: Run pilot pytest
        run: |
          cd course/rover/pilot
          python3 -m pytest test/ -q

  build:
    runs-on: ubuntu-24.04-arm
    needs: verify
    steps:
      - uses: actions/checkout@v6

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      # The ros2-jazzy extension calls `rosdep resolve` during
      # stage-runtime-dependencies. In LXD-backed builds the extension
      # seeds rosdep inside the container; in destructive-mode it uses
      # the host's rosdep, so we have to init it ourselves.
      # python3-rosdep isn't in the default Ubuntu repos (it lives in
      # the ROS 2 apt repo that snapcraft sets up later), so install via
      # pip from PyPI — same binary, no repo plumbing.
      - name: Initialize rosdep
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-pip
          sudo pip install --break-system-packages rosdep
          sudo rosdep init 2>/dev/null || true
          # Populate /root/.ros explicitly. snapcraft's stage-runtime-
          # dependencies step launches rosdep via `env -i` which clears
          # HOME, so rosdep falls back to the effective UID's home dir
          # (/root under our sudo snapcraft). Without this, rosdep reports
          # "not initialized" even though /home/runner/.ros is populated.
          sudo rosdep update

      # Cache the ROS 2 Jazzy stage-packages that snapcraft downloads every
      # run (~hundreds of MB of .debs). Key on snapcraft.yaml so new deps
      # invalidate automatically; restore-keys lets PR branches share the
      # base cache even when their snapcraft.yaml differs.
      - name: Cache snapcraft downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/snapcraft
          key: snapcraft-${{ runner.arch }}-${{ hashFiles('course/rover/snapcraft.yaml') }}
          restore-keys: |
            snapcraft-${{ runner.arch }}-

      # --destructive-mode builds directly on the runner VM instead of
      # spinning up an LXD container. The runner is already Ubuntu 24.04
      # (matches `base: core24`) and is thrown away after the job, so LXD
      # isolation adds only overhead (~3 min of base-image pull per run).
      # Needs sudo because the ros2-jazzy extension writes the ROS 2
      # apt keyring to /etc/apt/keyrings/. `HOME=$HOME` keeps snapcraft's
      # cache under /home/runner/.cache/snapcraft so actions/cache hits.
      - name: Build pilot snap
        id: build
        working-directory: course/rover
        env:
          SNAPCRAFT_BUILD_INFO: "1"
        run: |
          sudo -E HOME="$HOME" snapcraft --destructive-mode
          # Hand snapcraft's cache and state dirs back to the runner user:
          # - cache so the actions/cache save step can tar it,
          # - state so the later non-sudo `snapcraft upload` (publish step)
          #   can write its log file at ~/.local/state/snapcraft/log/.
          sudo chown -R "$(id -u):$(id -g)" \
            "$HOME/.cache/snapcraft" \
            "$HOME/.local/state/snapcraft" 2>/dev/null || true
          SNAP=$(ls fsk-rover-pilot_*.snap | head -1)
          test -n "$SNAP" || { echo "No .snap produced" >&2; exit 1; }
          echo "snap=${GITHUB_WORKSPACE}/course/rover/${SNAP}" >> "$GITHUB_OUTPUT"

      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: pilot-snap-arm64
          path: ${{ steps.build.outputs.snap }}
          retention-days: 7

      # PRs: artifact only (no publish).
      # main push: publish to `candidate` (staging channel for the field team).
      # Tag push (v*) or workflow_dispatch with release_channel: publish to that channel.
      - name: Publish snap to candidate (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: candidate

      - name: Publish snap to tagged channel
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge

      - name: Manual publish (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.release_channel != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ inputs.release_channel }}
