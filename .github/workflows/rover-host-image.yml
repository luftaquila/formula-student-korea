name: Build Rover bootc Image

on:
  push:
    branches: [main]
    paths:
      - 'rover/host/**'
      - '.github/workflows/rover-host-image.yml'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'OCI tag to publish (e.g. candidate, edge, vX.Y.Z).'
        required: false
        default: 'candidate'

permissions:
  contents: read
  packages: write

concurrency:
  group: rover-host-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fsk-rover-host

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            channel="${{ inputs.release_channel }}"
          else
            channel="candidate"
          fi
          echo "tag=${IMAGE}:${channel}" >> "$GITHUB_OUTPUT"

      - name: Build and push host image
        uses: docker/build-push-action@v7
        with:
          context: rover/host
          file: rover/host/Containerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=rover-host
          cache-to: type=gha,scope=rover-host,mode=max
