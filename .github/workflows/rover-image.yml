name: Build Rover Image

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 14:00 KST (05:00 UTC) so the image tracks recent snap releases.
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      # Tar+base64 of the snap create-key gnupg homedir (usually ~/.snap/gnupg
      # on classic Ubuntu hosts). See course/rover/image/README.md.
      SNAP_BRAND_KEY_B64: ${{ secrets.SNAP_BRAND_KEY_B64 }}
      # Name of the registered signing key (e.g. "fsk-rover-signing").
      SNAP_BRAND_KEY_NAME: ${{ vars.SNAP_BRAND_KEY_NAME }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate signing inputs
        run: |
          test -n "$SNAP_BRAND_KEY_B64" || {
            echo "SNAP_BRAND_KEY_B64 secret is required" >&2; exit 1
          }
          test -n "$SNAP_BRAND_KEY_NAME" || {
            echo "SNAP_BRAND_KEY_NAME repo variable is required" >&2; exit 1
          }

      - name: Install snap tooling
        run: |
          sudo snap install snapcraft --classic
          sudo snap install ubuntu-image --classic

      # See rover-snap.yml for rationale; destructive-mode needs host-level
      # rosdep initialization.
      - name: Initialize rosdep
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-pip
          sudo pip install --break-system-packages rosdep
          sudo rosdep init 2>/dev/null || true
          sudo rosdep update

      # Same cache as rover-snap.yml so both workflows share the ROS 2 Jazzy
      # stage-packages (~hundreds of MB of .debs).
      - name: Cache snapcraft downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/snapcraft
          key: snapcraft-${{ runner.arch }}-${{ hashFiles('course/rover/snapcraft.yaml') }}
          restore-keys: |
            snapcraft-${{ runner.arch }}-

      # --destructive-mode avoids the ~3 min LXD base-image pull. See
      # rover-snap.yml for the full rationale.
      - name: Build pilot snap
        id: build
        working-directory: course/rover
        env:
          SNAPCRAFT_BUILD_INFO: "1"
        run: |
          sudo -E HOME="$HOME" snapcraft --destructive-mode
          sudo chown -R "$(id -u):$(id -g)" \
            "$HOME/.cache/snapcraft" \
            "$HOME/.local/state/snapcraft" 2>/dev/null || true
          SNAP=$(ls fsk-rover-pilot_*.snap | head -1)
          test -n "$SNAP" || { echo "No .snap produced" >&2; exit 1; }
          echo "snap=${GITHUB_WORKSPACE}/course/rover/${SNAP}" >> "$GITHUB_OUTPUT"

      - name: Import brand signing key
        run: |
          # snapd's create-key/sign uses ~/.snap/gnupg on classic Ubuntu hosts.
          KEYDIR="$HOME/.snap/gnupg"
          mkdir -p "$KEYDIR"
          chmod 700 "$KEYDIR"
          printf '%s' "$SNAP_BRAND_KEY_B64" | base64 -d | tar xz -C "$KEYDIR"
          # Verify the expected key is now visible to snapd.
          snap keys
          snap keys | awk 'NR>1 {print $1}' | grep -Fxq "$SNAP_BRAND_KEY_NAME" || {
            echo "Signing key '$SNAP_BRAND_KEY_NAME' not found in keystore" >&2
            exit 1
          }

      - name: Build and sign model assertion
        run: |
          mkdir -p .tmp
          # Refresh timestamp so the assertion never drifts more than a few
          # minutes from signing time (Store policy enforces recency).
          TS="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          jq --arg ts "$TS" '.timestamp=$ts' \
            course/rover/image/model.assertion.template > .tmp/rover.model.json
          snap sign -k "$SNAP_BRAND_KEY_NAME" < .tmp/rover.model.json > .tmp/rover.model
          head -n 20 .tmp/rover.model

      - name: Build and sign system-user assertion
        run: |
          # Pull the team's SSH public keys at build time so we don't have to
          # keep the authorised_keys list in git.
          curl -fsSL https://github.com/luftaquila.keys > .tmp/ssh-keys.txt
          test -s .tmp/ssh-keys.txt || {
            echo "Fetched key list is empty" >&2; exit 1;
          }
          jq -Rs 'split("\n") | map(select(length>0))' .tmp/ssh-keys.txt > .tmp/ssh-keys.json

          TS_NOW=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)
          # Assertion is valid for 2 years — long enough that monthly image
          # rebuilds keep it fresh, short enough to rotate if a key leaks.
          TS_END=$(date -u -d '+2 years' +%Y-%m-%dT%H:%M:%S+00:00)
          # `until` is a reserved word in jq, so reference the field via its
          # quoted form; same caution applies if new reserved-name fields appear.
          jq --slurpfile keys .tmp/ssh-keys.json \
             --arg now "$TS_NOW" --arg expiry "$TS_END" \
             '."ssh-keys"=$keys[0] | .since=$now | .timestamp=$now | ."until"=$expiry' \
             course/rover/image/system-user.template.json > .tmp/system-user.json
          snap sign -k "$SNAP_BRAND_KEY_NAME" < .tmp/system-user.json \
            > .tmp/auto-import.assert
          head -n 20 .tmp/auto-import.assert

      - name: Build Ubuntu Core image
        run: |
          mkdir -p .tmp/image
          # --assertion bakes the system-user assertion into the seed at
          # build time, so snapd picks it up on first boot and creates the
          # fsk user. Only works because the model is grade: dangerous and
          # the assertion uses ssh-keys (no password).
          ubuntu-image snap \
            --snap "${{ steps.build.outputs.snap }}" \
            --assertion .tmp/auto-import.assert \
            --output-dir .tmp/image \
            .tmp/rover.model

      - name: Upload image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rover-ubuntu-core-image
          path: .tmp/image/*
          retention-days: 7

      - name: Upload auto-import.assert (USB fallback)
        # The same assertion as a standalone artifact, for manual provisioning
        # on a pre-built image or to recover an already-flashed rover.
        uses: actions/upload-artifact@v7
        with:
          name: rover-auto-import-assert
          path: .tmp/auto-import.assert
          retention-days: 7
