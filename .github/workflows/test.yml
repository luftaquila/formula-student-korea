name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Makefile'
      - 'LICENSE'
      - '.env.example'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Makefile'
      - 'LICENSE'
      - '.env.example'
      - '.gitignore'

permissions:
  contents: read
  packages: read   # ghcr 이미지 pull에는 read면 충분(어떤 잡도 이미지를 push하지 않음)
  actions: read    # PR base 커밋의 이미지 게시 workflow 완료 여부 조회
  checks: write    # dorny/test-reporter가 체크 결과를 게시하는 데 필요

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            auth/package-lock.json
            queue/package-lock.json
            inspection/package-lock.json
            traffic/package-lock.json
            score/package-lock.json
            documents/package-lock.json
            competition/package-lock.json
            course/package-lock.json
            calendar/package-lock.json
            email/package-lock.json

      - name: Install dependencies
        run: |
          for dir in auth queue inspection traffic score documents competition course calendar email; do
            cd $dir && npm ci && cd ..
          done

      - name: Run tests
        run: |
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results.xml \
            tests/**/*.test.mjs

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Unit Tests
          path: test-results.xml
          # Node emits nested JUnit suites; this parser preserves their test cases.
          reporter: phpunit-junit

  # Decide which service images each e2e shard must build vs pull. main's CI
  # (build.yml) publishes ghcr.io/<repo>/<svc>:latest for every service, so a
  # shard only needs to build services whose code differs from main; the rest
  # are pulled. A change to shared/, Dockerfile.service or entrypoint.sh rebuilds
  # everything (all service images depend on them); landing/ rebuilds caddy.
  changes:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      bake_targets: ${{ steps.plan.outputs.bake_targets }}
      pull_std: ${{ steps.plan.outputs.pull_std }}
      pull_caddy: ${{ steps.plan.outputs.pull_caddy }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - 'shared/**'
            dockerfile-service:
              - 'Dockerfile.service'
              - 'entrypoint.sh'
            docker-context:
              - '.dockerignore'
            landing:
              - 'landing/**'
            auth:
              - 'auth/**'
            entry:
              - 'entry/**'
            queue:
              - 'queue/**'
            inspection:
              - 'inspection/**'
            traffic:
              - 'traffic/**'
            score:
              - 'score/**'
            documents:
              - 'documents/**'
            competition:
              - 'competition/**'
            email:
              - 'email/**'
            course:
              - 'course/**'
            calendar:
              - 'calendar/**'

      - name: Plan builds vs pulls
        id: plan
        env:
          SHARED: ${{ steps.filter.outputs.shared }}
          DOCKERFILE_SVC: ${{ steps.filter.outputs.dockerfile-service }}
          DOCKER_CONTEXT: ${{ steps.filter.outputs.docker-context }}
          LANDING: ${{ steps.filter.outputs.landing }}
          F_AUTH: ${{ steps.filter.outputs.auth }}
          F_ENTRY: ${{ steps.filter.outputs.entry }}
          F_QUEUE: ${{ steps.filter.outputs.queue }}
          F_INSPECTION: ${{ steps.filter.outputs.inspection }}
          F_TRAFFIC: ${{ steps.filter.outputs.traffic }}
          F_SCORE: ${{ steps.filter.outputs.score }}
          F_DOCUMENTS: ${{ steps.filter.outputs.documents }}
          F_COMPETITION: ${{ steps.filter.outputs.competition }}
          F_EMAIL: ${{ steps.filter.outputs.email }}
          F_COURSE: ${{ steps.filter.outputs.course }}
          F_CALENDAR: ${{ steps.filter.outputs.calendar }}
        run: |
          competition_changed="$F_COMPETITION"
          for value in "$F_ENTRY" "$F_QUEUE" "$F_INSPECTION" "$F_TRAFFIC" "$F_SCORE" "$F_DOCUMENTS"; do
            if [ "$value" = "true" ]; then competition_changed=true; fi
          done
          declare -A F=(
            [auth]="$F_AUTH" [competition]="$competition_changed"
            [email]="$F_EMAIL" [course]="$F_COURSE" [calendar]="$F_CALENDAR"
          )
          STD=(auth competition email course calendar)
          rebuild_all=false
          if [ "$SHARED" = "true" ] || [ "$DOCKERFILE_SVC" = "true" ] || [ "$DOCKER_CONTEXT" = "true" ]; then rebuild_all=true; fi
          build=(); pull=()
          for svc in "${STD[@]}"; do
            if [ "$rebuild_all" = "true" ] || [ "${F[$svc]}" = "true" ]; then
              build+=("$svc")
            else
              pull+=("$svc")
            fi
          done
          targets=("${build[@]}")
          if [ "$LANDING" = "true" ] || [ "$SHARED" = "true" ] || [ "$DOCKER_CONTEXT" = "true" ]; then
            targets+=("caddy-local"); pull_caddy=false
          else
            pull_caddy=true
          fi
          bake=$(IFS=,; echo "${targets[*]}")
          pull_std=$(IFS=' '; echo "${pull[*]}")
          echo "bake_targets=$bake" >> "$GITHUB_OUTPUT"
          echo "pull_std=$pull_std" >> "$GITHUB_OUTPUT"
          echo "pull_caddy=$pull_caddy" >> "$GITHUB_OUTPUT"
          echo "Plan: build=[$bake]  pull_std=[$pull_std]  pull_caddy=$pull_caddy"

      # A PR can be rebased immediately after another PR merges while main's
      # image publishing workflow is still running. Wait in this already-running
      # job so E2E does not pay for another runner allocation and scheduling hop.
      - name: Wait for base images to be published
        if: github.event_name == 'pull_request' && (steps.plan.outputs.pull_std != '' || steps.plan.outputs.pull_caddy == 'true')
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const baseSha = context.payload.pull_request.base.sha;
            const discoveryDeadline = Date.now() + 60_000;
            const completionDeadline = Date.now() + 20 * 60_000;
            let run = null;

            while (!run && Date.now() < discoveryDeadline) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'build.yml',
                head_sha: baseSha,
                event: 'push',
                per_page: 10,
              });
              run = response.data.workflow_runs[0] || null;
              if (!run) await new Promise(resolve => setTimeout(resolve, 10_000));
            }

            if (!run) {
              core.info(`No image build run exists for base ${baseSha}; continuing with current images.`);
              return;
            }

            core.info(`Waiting for base image run ${run.id}: ${run.html_url}`);
            while (run.status !== 'completed' && Date.now() < completionDeadline) {
              await new Promise(resolve => setTimeout(resolve, 15_000));
              const response = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
              run = response.data;
            }

            if (run.status !== 'completed') {
              core.setFailed(`Timed out waiting for base image run ${run.id}.`);
            } else if (run.conclusion !== 'success') {
              core.setFailed(`Base image run ${run.id} completed with ${run.conclusion}.`);
            } else {
              core.info(`Base images for ${baseSha} are available.`);
            }

  e2e:
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Shard the e2e run across parallel jobs, each on its own docker stack.
        # --no-deps skips dependency projects (data comes from global-setup, not
        # upstream tests), so auth/entry aren't re-run per shard. The large auth,
        # queue, and score projects are split by file ownership as well: this both
        # balances the wall clock and prevents unrelated specs from sharing global
        # users, queues, endurance rows, and penalty settings. Operational shards
        # seed every required team before operational tests begin. Teams remain
        # directly editable throughout the run. auth and cross-service run isolated:
        # cross-service's multi-service load broke auth's log-aggregation page
        # when co-located.
        include:
          - shard: auth-core
            projects: >-
              --project=auth
              tests/e2e/auth/account-applications.spec.mjs
              tests/e2e/auth/bulk-operations.spec.mjs
              tests/e2e/auth/csv-upload.spec.mjs
              tests/e2e/auth/forward-auth.spec.mjs
              tests/e2e/auth/ops-contacts.spec.mjs
              tests/e2e/auth/rbac.spec.mjs
              tests/e2e/auth/role-propagation.spec.mjs
              tests/e2e/auth/session.spec.mjs
              tests/e2e/auth/user-management.spec.mjs
            workers: 2
            services: auth competition email
            seeds: users vehicle-types entries
          - shard: auth-logs
            projects: >-
              --project=auth
              tests/e2e/auth/log-aggregation.spec.mjs
              tests/e2e/auth/logs-filters.spec.mjs
              tests/e2e/auth/logs.spec.mjs
            workers: 2
            # The aggregation endpoint always queries every configured service.
            # Starting all of them avoids a guaranteed 5s timeout on every logs
            # page load for otherwise-absent calendar and course containers.
            services: auth competition email course calendar
            seeds: users vehicle-types entries
          - shard: cross-service
            projects: --project=cross-service
            workers: 2
            services: auth competition
            seeds: users vehicle-types entries cross-service-entries inspection documents
          - shard: queue-operations
            projects: >-
              --project=queue
              tests/e2e/queue/booth-advanced.spec.mjs
              tests/e2e/queue/booth-and-scoping.spec.mjs
              tests/e2e/queue/booth-management.spec.mjs
              tests/e2e/queue/concurrent-officials.spec.mjs
              tests/e2e/queue/priority.spec.mjs
              tests/e2e/queue/queue-status-success.spec.mjs
              tests/e2e/queue/realtime-sync.spec.mjs
            workers: 2
            services: auth competition email
            seeds: users vehicle-types entries queue-entries
          - shard: queue-public-settings
            projects: >-
              --project=queue
              tests/e2e/queue/penalties.spec.mjs
              tests/e2e/queue/queue-status.spec.mjs
              tests/e2e/queue/rank-realtime.spec.mjs
              tests/e2e/queue/rbac.spec.mjs
              tests/e2e/queue/registration.spec.mjs
              tests/e2e/queue/settings.spec.mjs
              tests/e2e/queue/stats.spec.mjs
            workers: 2
            services: auth competition email
            seeds: users vehicle-types entries
          - shard: traffic
            projects: --project=traffic
            workers: 3
            services: auth competition
            seeds: users vehicle-types entries
          - shard: inspection
            projects: --project=inspection
            workers: 3
            services: auth competition
            # Inspection reliability/RBAC specs own teams 7, 28, and 98. Seed
            # them only in this isolated shard so canonical team validation is
            # exercised without changing the eight-team baseline elsewhere.
            seeds: users vehicle-types entries inspection-entries inspection
          - shard: documents
            projects: --project=documents
            workers: 3
            services: auth competition email
            seeds: users vehicle-types entries documents
          - shard: score-endurance
            projects: >-
              --project=score
              tests/e2e/score/endurance-dsq-flow.spec.mjs
              tests/e2e/score/endurance-realtime.spec.mjs
              tests/e2e/score/endurance.spec.mjs
            workers: 3
            services: auth competition
            seeds: users vehicle-types entries inspection
          - shard: score-settings
            projects: >-
              --project=score
              tests/e2e/score/calculation.spec.mjs
              tests/e2e/score/penalty-recalculation.spec.mjs
              tests/e2e/score/penalty-settings.spec.mjs
              tests/e2e/score/public-board.spec.mjs
              tests/e2e/score/score-realtime-sync.spec.mjs
            # These files intentionally exercise the same global score, penalty
            # and publication settings; serial execution makes that ownership explicit.
            workers: 1
            services: auth competition
            seeds: users vehicle-types entries inspection
          - shard: score-ui
            projects: >-
              --project=score
              tests/e2e/score/dashboard.spec.mjs
              tests/e2e/score/detail-sort.spec.mjs
              tests/e2e/score/export.spec.mjs
              tests/e2e/score/manual-scores.spec.mjs
              tests/e2e/score/rbac.spec.mjs
              tests/e2e/score/year-switch.spec.mjs
            workers: 3
            services: auth competition
            seeds: users vehicle-types entries inspection
          - shard: entry-course
            projects: --project=entry --project=course
            workers: 2
            services: auth competition course
            seeds: users vehicle-types entries
          - shard: calendar-security
            projects: --project=calendar --project=security
            workers: 2
            services: auth competition course calendar
            seeds: users

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      # Intersect the services needed by this shard with the global change plan.
      # Unrelated changed services are neither pulled nor rebuilt in this job.
      - name: Plan shard images
        id: shard-plan
        env:
          REQUIRED_SERVICES: ${{ matrix.services }}
          GLOBAL_BAKE_TARGETS: ${{ needs.changes.outputs.bake_targets }}
          PULL_CADDY: ${{ needs.changes.outputs.pull_caddy }}
        run: |
          build=(); pull=()
          for svc in $REQUIRED_SERVICES; do
            if [[ ",$GLOBAL_BAKE_TARGETS," == *",$svc,"* ]]; then
              build+=("$svc")
            else
              pull+=("$svc")
            fi
          done
          if [[ ",$GLOBAL_BAKE_TARGETS," == *",caddy-local,"* ]]; then
            build+=("caddy-local")
          fi
          bake=$(IFS=,; echo "${build[*]}")
          pull_std=$(IFS=' '; echo "${pull[*]}")
          echo "bake_targets=$bake" >> "$GITHUB_OUTPUT"
          echo "pull_std=$pull_std" >> "$GITHUB_OUTPUT"
          echo "pull_caddy=$PULL_CADDY" >> "$GITHUB_OUTPUT"
          echo "Shard plan: build=[$bake] pull_std=[$pull_std] pull_caddy=$PULL_CADDY"

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          JWT_SECRET=e2e-test-secret
          INTERNAL_SECRET=e2e-internal-secret
          ADMIN_EMAIL=e2e-admin@test.com
          GOOGLE_CLIENT_ID=dummy
          GOOGLE_CLIENT_SECRET=dummy
          PUBLIC_URL=http://localhost:9000
          EOF

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub intermittently times out the buildkit image manifest/token
      # (anonymous rate limit), which fails the buildx setup's single pull and
      # kills the job at the setup step. Pre-pull with retry so the setup below
      # reuses the local image instead of hitting Docker Hub again. Gated on the
      # same condition as the buildx setup — skipped when nothing needs building.
      - name: Pre-pull BuildKit image (retry; Docker Hub pulls flake)
        if: steps.shard-plan.outputs.bake_targets != ''
        run: |
          for i in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "::warning::moby/buildkit pull attempt $i failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Set up Docker Buildx
        if: steps.shard-plan.outputs.bake_targets != ''
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:buildx-stable-1
          # Route Docker Hub (docker.io) base-image pulls through Google's
          # pull-through mirror. A shared/ change rebuilds all runtime images on
          # every shard, and anonymous Docker Hub pulls rate-limit /
          # 5xx (auth.docker.io 520, manifest 504) at that volume — there are no
          # Docker Hub creds in this repo. The mirror serves the same official
          # base images without the anonymous per-IP limit.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # Pull prebuilt :latest for services unchanged vs main; build only changed
      # ones below. This is the wall-clock win: a test-only change pulls every
      # image and builds nothing.
      - name: Pull prebuilt images for unchanged services
        run: |
          retry_pull() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::Image pull attempt $attempt failed; retrying in 5s"
                sleep 5
              fi
            done
            return 1
          }
          if [ -n "${{ steps.shard-plan.outputs.pull_std }}" ]; then
            retry_pull docker compose pull ${{ steps.shard-plan.outputs.pull_std }}
          fi
          if [ "${{ steps.shard-plan.outputs.pull_caddy }}" = "true" ]; then
            retry_pull docker compose --profile local pull caddy-local
          fi

      - name: Build changed images
        if: steps.shard-plan.outputs.bake_targets != ''
        uses: docker/bake-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          # Build from the checked-out workspace. The action otherwise fetches
          # github.sha again as a remote Git context, which can fail every shard
          # independently on a transient GitHub 5xx response.
          source: .
          files: compose.yml
          targets: ${{ steps.shard-plan.outputs.bake_targets }}
          # No layer cache, deliberately. Every target shared one gha scope, so
          # each image's export overwrote the previous one's manifest and the
          # next run could only hit for whichever wrote last — a measured 3
          # manifest imports and 4 CACHED layers across 8 images. The export was
          # not a free bet either: it was 593s of a 621s bake step (the images
          # themselves build in ~30s), and at 13 shards x ~8 images per run it
          # pushed the repository's Actions cache to 11.5GB against a 10GB limit
          # across 10,811 entries, so the resulting eviction also churned the
          # npm and Playwright caches that do pay off.
          #
          # No `set: <target>.tags=...` either. bake takes each target's tag from
          # that service's `image:` in compose.yml, which is the name `docker
          # compose up --no-build` then looks for — so overriding it can only
          # match or break it. It matched: `github.repository` is exactly the
          # repo path hardcoded in compose.yml. In a fork it would not, and the
          # override would tag images under the fork path while compose kept
          # looking for the upstream one. calendar never had an override and was
          # tagged correctly regardless, which is what proves the rest were dead
          # weight.
          load: true

      # No --wait: services boot in the background while node/playwright install
      # below, and global-setup polls every 2s for readiness. The compose
      # healthcheck interval is 30s, so --wait blocked ~30s even though the
      # services are actually up within a few seconds.
      - name: Start services
        run: |
          docker compose up -d --no-deps --no-build ${{ matrix.services }}
          docker compose --profile local up -d --no-deps --no-build caddy-local

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restore Playwright cache
        id: playwright-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Run E2E tests
        env:
          E2E_SERVICES: ${{ matrix.services }}
          E2E_SEEDS: ${{ matrix.seeds }}
        run: npx playwright test --no-deps --workers=${{ matrix.workers }} ${{ matrix.projects }}

      - name: Save Playwright cache
        uses: actions/cache/save@v5
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: E2E Tests (${{ matrix.shard }})
          path: e2e-results.xml
          reporter: java-junit

      - name: Stop services
        if: always()
        run: docker compose --profile local down -v
