name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Makefile'
      - 'LICENSE'
      - '.env.example'
      - '.gitignore'

permissions:
  packages: write
  checks: write

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          for dir in auth entry queue inspection traffic score documents course; do
            cd $dir && npm ci && cd ..
          done

      - name: Run tests
        run: |
          node --test --test-force-exit \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results.xml \
            tests/**/*.test.mjs

      - name: Test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Unit Tests
          path: test-results.xml
          reporter: java-junit

  e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          JWT_SECRET=e2e-test-secret
          INTERNAL_SECRET=e2e-internal-secret
          ADMIN_EMAIL=e2e-admin@test.com
          GOOGLE_CLIENT_ID=dummy
          GOOGLE_CLIENT_SECRET=dummy
          PUBLIC_URL=http://localhost:9000
          EOF

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Build images with cache
        uses: docker/bake-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          files: compose.yml
          targets: auth,entry,queue,inspection,traffic,score,documents,course,caddy-local
          set: |
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository }}/cache:buildkit
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository }}/cache:buildkit,mode=min
            auth.tags=formula-student-korea-auth
            entry.tags=formula-student-korea-entry
            queue.tags=formula-student-korea-queue
            inspection.tags=formula-student-korea-inspection
            traffic.tags=formula-student-korea-traffic
            score.tags=formula-student-korea-score
            documents.tags=formula-student-korea-documents
            course.tags=formula-student-korea-course
            caddy-local.tags=formula-student-korea-caddy-local
          load: true

      - name: Start services
        run: |
          docker compose up -d --wait --no-build auth entry queue inspection traffic score documents course
          docker compose --profile local up -d --no-deps --no-build caddy-local
          sleep 3
          curl -sf http://localhost:9000/auth/api/health

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restore Playwright cache
        id: playwright-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps only
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run E2E tests
        run: npx playwright test

      - name: Save Playwright cache
        uses: actions/cache/save@v5
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: E2E Tests
          path: e2e-results.xml
          reporter: java-junit

      - name: Stop services
        if: always()
        run: docker compose --profile local down -v
