name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restore npm cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.npm
          key: test-npm-${{ runner.os }}-${{ hashFiles('*/package-lock.json') }}

      - name: Install dependencies
        run: |
          for dir in auth entry queue inspection traffic score documents; do
            cd $dir && npm ci && cd ..
          done

      - name: Run tests
        run: node --test --test-force-exit tests/**/*.test.mjs

      - name: Save npm cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: ~/.npm
          key: test-npm-${{ runner.os }}-${{ hashFiles('*/package-lock.json') }}
