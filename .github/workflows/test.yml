name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          for dir in auth entry queue inspection traffic score documents; do
            cd $dir && npm ci && cd ..
          done

      - name: Run tests
        run: |
          node --test --test-force-exit \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results.xml \
            tests/**/*.test.mjs

      - name: Test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Unit Tests
          path: test-results.xml
          reporter: java-junit

