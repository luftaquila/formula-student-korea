name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Makefile'
      - 'LICENSE'
      - '.env.example'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Makefile'
      - 'LICENSE'
      - '.env.example'
      - '.gitignore'

permissions:
  packages: write
  checks: write

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          for dir in auth entry queue inspection traffic score documents course calendar email; do
            cd $dir && npm ci && cd ..
          done

      - name: Run tests
        run: |
          node --test --test-force-exit \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results.xml \
            tests/**/*.test.mjs

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Unit Tests
          path: test-results.xml
          reporter: java-junit

  # Decide which service images each e2e shard must build vs pull. main's CI
  # (build.yml) publishes ghcr.io/<repo>/<svc>:latest for every service, so a
  # shard only needs to build services whose code differs from main; the rest
  # are pulled. A change to shared/, Dockerfile.service or entrypoint.sh rebuilds
  # everything (all service images depend on them); landing/ rebuilds caddy.
  changes:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      bake_targets: ${{ steps.plan.outputs.bake_targets }}
      pull_std: ${{ steps.plan.outputs.pull_std }}
      pull_caddy: ${{ steps.plan.outputs.pull_caddy }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - 'shared/**'
            dockerfile-service:
              - 'Dockerfile.service'
              - 'entrypoint.sh'
            landing:
              - 'landing/**'
            auth:
              - 'auth/**'
            entry:
              - 'entry/**'
            queue:
              - 'queue/**'
            inspection:
              - 'inspection/**'
            traffic:
              - 'traffic/**'
            score:
              - 'score/**'
            documents:
              - 'documents/**'
            course:
              - 'course/**'
            calendar:
              - 'calendar/**'

      - name: Plan builds vs pulls
        id: plan
        env:
          SHARED: ${{ steps.filter.outputs.shared }}
          DOCKERFILE_SVC: ${{ steps.filter.outputs.dockerfile-service }}
          LANDING: ${{ steps.filter.outputs.landing }}
          F_AUTH: ${{ steps.filter.outputs.auth }}
          F_ENTRY: ${{ steps.filter.outputs.entry }}
          F_QUEUE: ${{ steps.filter.outputs.queue }}
          F_INSPECTION: ${{ steps.filter.outputs.inspection }}
          F_TRAFFIC: ${{ steps.filter.outputs.traffic }}
          F_SCORE: ${{ steps.filter.outputs.score }}
          F_DOCUMENTS: ${{ steps.filter.outputs.documents }}
          F_COURSE: ${{ steps.filter.outputs.course }}
          F_CALENDAR: ${{ steps.filter.outputs.calendar }}
        run: |
          declare -A F=(
            [auth]="$F_AUTH" [entry]="$F_ENTRY" [queue]="$F_QUEUE"
            [inspection]="$F_INSPECTION" [traffic]="$F_TRAFFIC" [score]="$F_SCORE"
            [documents]="$F_DOCUMENTS" [course]="$F_COURSE" [calendar]="$F_CALENDAR"
          )
          STD=(auth entry queue inspection traffic score documents course calendar)
          rebuild_all=false
          if [ "$SHARED" = "true" ] || [ "$DOCKERFILE_SVC" = "true" ]; then rebuild_all=true; fi
          build=(); pull=()
          for svc in "${STD[@]}"; do
            if [ "$rebuild_all" = "true" ] || [ "${F[$svc]}" = "true" ]; then
              build+=("$svc")
            else
              pull+=("$svc")
            fi
          done
          targets=("${build[@]}")
          if [ "$LANDING" = "true" ] || [ "$SHARED" = "true" ]; then
            targets+=("caddy-local"); pull_caddy=false
          else
            pull_caddy=true
          fi
          bake=$(IFS=,; echo "${targets[*]}")
          pull_std=$(IFS=' '; echo "${pull[*]}")
          echo "bake_targets=$bake" >> "$GITHUB_OUTPUT"
          echo "pull_std=$pull_std" >> "$GITHUB_OUTPUT"
          echo "pull_caddy=$pull_caddy" >> "$GITHUB_OUTPUT"
          echo "Plan: build=[$bake]  pull_std=[$pull_std]  pull_caddy=$pull_caddy"

  e2e:
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Shard the e2e run across parallel jobs, each on its own docker stack.
        # --no-deps skips dependency projects (data comes from global-setup, not
        # upstream tests), so auth/entry aren't re-run per shard. Co-located only
        # where safe: queue+traffic and inspection+documents already run
        # concurrently today (entry-deps siblings); score+entry touch disjoint
        # services (score is kept away from traffic/inspection, whose data it
        # aggregates). auth and cross-service run isolated: cross-service's
        # multi-service load broke auth's log-aggregation page when co-located.
        include:
          - shard: auth
            projects: --project=auth
          - shard: cross-service
            projects: --project=cross-service
          - shard: queue-traffic
            projects: --project=queue --project=traffic
          - shard: inspection-documents
            projects: --project=inspection --project=documents
          - shard: score-entry-course
            projects: --project=score --project=entry --project=course
          - shard: calendar-security
            projects: --project=calendar --project=security

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          JWT_SECRET=e2e-test-secret
          INTERNAL_SECRET=e2e-internal-secret
          ADMIN_EMAIL=e2e-admin@test.com
          GOOGLE_CLIENT_ID=dummy
          GOOGLE_CLIENT_SECRET=dummy
          PUBLIC_URL=http://localhost:9000
          EOF

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub intermittently times out the buildkit image manifest/token
      # (anonymous rate limit), which fails the buildx setup's single pull and
      # kills the job at the setup step. Pre-pull with retry so the setup below
      # reuses the local image instead of hitting Docker Hub again. Gated on the
      # same condition as the buildx setup — skipped when nothing needs building.
      - name: Pre-pull BuildKit image (retry; Docker Hub pulls flake)
        if: needs.changes.outputs.bake_targets != ''
        run: |
          for i in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "::warning::moby/buildkit pull attempt $i failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Set up Docker Buildx
        if: needs.changes.outputs.bake_targets != ''
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:buildx-stable-1
          # Route Docker Hub (docker.io) base-image pulls through Google's
          # pull-through mirror. A shared/ change rebuilds all 9 images on every
          # shard (~45 builds/run), and anonymous Docker Hub pulls rate-limit /
          # 5xx (auth.docker.io 520, manifest 504) at that volume — there are no
          # Docker Hub creds in this repo. The mirror serves the same official
          # base images without the anonymous per-IP limit.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # Pull prebuilt :latest for services unchanged vs main; build only changed
      # ones below. This is the wall-clock win: a test-only change pulls every
      # image and builds nothing.
      - name: Pull prebuilt images for unchanged services
        run: |
          if [ -n "${{ needs.changes.outputs.pull_std }}" ]; then
            docker compose pull ${{ needs.changes.outputs.pull_std }}
          fi
          if [ "${{ needs.changes.outputs.pull_caddy }}" = "true" ]; then
            docker compose --profile local pull caddy-local
          fi

      - name: Build changed images
        if: needs.changes.outputs.bake_targets != ''
        uses: docker/bake-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          files: compose.yml
          targets: ${{ needs.changes.outputs.bake_targets }}
          # The 5 e2e shards build concurrently. A shared cache scope races on
          # the gha manifest ("blob not found"), so each shard owns its scope.
          # The gha cache backend also intermittently 504s on export under load;
          # ignore-error keeps a failed cache export from failing the build —
          # the image is already built and loaded, the cache is just a speedup.
          set: |
            *.cache-from=type=gha,scope=e2e-${{ matrix.shard }}
            *.cache-to=type=gha,scope=e2e-${{ matrix.shard }},mode=min,ignore-error=true
            auth.tags=ghcr.io/${{ github.repository }}/auth:latest
            entry.tags=ghcr.io/${{ github.repository }}/entry:latest
            queue.tags=ghcr.io/${{ github.repository }}/queue:latest
            inspection.tags=ghcr.io/${{ github.repository }}/inspection:latest
            traffic.tags=ghcr.io/${{ github.repository }}/traffic:latest
            score.tags=ghcr.io/${{ github.repository }}/score:latest
            documents.tags=ghcr.io/${{ github.repository }}/documents:latest
            course.tags=ghcr.io/${{ github.repository }}/course:latest
            caddy-local.tags=ghcr.io/${{ github.repository }}/caddy:latest
          load: true

      # No --wait: services boot in the background while node/playwright install
      # below, and global-setup polls every 2s for readiness. The compose
      # healthcheck interval is 30s, so --wait blocked ~30s even though the
      # services are actually up within a few seconds.
      - name: Start services
        run: |
          docker compose up -d --no-build auth entry queue inspection traffic score documents course calendar
          docker compose --profile local up -d --no-deps --no-build caddy-local

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restore Playwright cache
        id: playwright-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps only
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run E2E tests
        run: npx playwright test --no-deps ${{ matrix.projects }}

      - name: Save Playwright cache
        uses: actions/cache/save@v5
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: E2E Tests (${{ matrix.shard }})
          path: e2e-results.xml
          reporter: java-junit

      - name: Stop services
        if: always()
        run: docker compose --profile local down -v
