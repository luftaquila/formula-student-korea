name: Build Traffic Device Firmware

on:
  push:
    branches: [main]
    paths:
      - 'competition/modules/traffic/device/wireless/firmware/**'
      - '.github/workflows/traffic-device.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep in sync with competition/modules/traffic/device/wireless/firmware/tools/build.sh.
env:
  NRFX_REF: 'v4.3.0'
  CMSIS_REF: '5.9.0'
  MONOCYPHER_REF: '4.0.2'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            python3 \
            build-essential \
            git

      - name: Cache bare-metal deps
        uses: actions/cache@v5
        with:
          path: competition/modules/traffic/device/wireless/firmware/vendor
          key: nrf-deps-nrfx${{ env.NRFX_REF }}-cmsis${{ env.CMSIS_REF }}-mc${{ env.MONOCYPHER_REF }}

      - name: Build
        # build.sh clones nrfx + CMSIS at the pinned refs (skipped on cache hit),
        # then configures + builds with the arm-none-eabi toolchain file.
        run: competition/modules/traffic/device/wireless/firmware/tools/build.sh

      - name: Verify firmware artifacts
        run: |
          ls -la competition/modules/traffic/device/wireless/firmware/build/traffic_device.uf2
          ls -la competition/modules/traffic/device/wireless/firmware/build/traffic_device.elf
          arm-none-eabi-size competition/modules/traffic/device/wireless/firmware/build/traffic_device.elf

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: traffic-device-firmware
          path: |
            competition/modules/traffic/device/wireless/firmware/build/traffic_device.uf2
            competition/modules/traffic/device/wireless/firmware/build/traffic_device.elf
            competition/modules/traffic/device/wireless/firmware/build/traffic_device.bin
          if-no-files-found: error
          retention-days: 30
