name: Build Images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Makefile'
      - 'LICENSE'
      - '.env.example'
      - '.gitignore'
  workflow_dispatch:

permissions:
  packages: write
  contents: read

# Serialize all Build Images runs. Each service is pushed by digest as an
# UNTAGGED image, then the merge job creates the :latest manifest list and its
# "Delete orphaned versions" step prunes every untagged version not referenced
# by :latest. With no guard, two runs from back-to-back main merges overlap and
# one run's prune deletes the other run's just-pushed (still untagged) digests,
# so its manifest create fails with "sha256:...: not found". Serializing (never
# cancelling, so an in-flight publish always finishes) removes the cross-run race.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.set-matrix.outputs.build-matrix }}
      services-matrix: ${{ steps.set-matrix.outputs.services-matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            shared:
              - 'shared/**'
            dockerfile-service:
              - 'Dockerfile.service'
              - 'entrypoint.sh'
            docker-context:
              - '.dockerignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            auth:
              - 'auth/**'
            entry:
              - 'entry/**'
            queue:
              - 'queue/**'
            registration:
              - 'registration/**'
            inspection:
              - 'inspection/**'
            traffic:
              - 'traffic/**'
            score:
              - 'score/**'
            documents:
              - 'documents/**'
            competition:
              - 'competition/**'
            course:
              - 'course/**'
            calendar:
              - 'calendar/**'
            email:
              - 'email/**'
            landing:
              - 'landing/**'

      - name: Build matrix
        id: set-matrix
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          SHARED: ${{ steps.filter.outputs.shared }}
          DOCKERFILE_SVC: ${{ steps.filter.outputs.dockerfile-service }}
          DOCKER_CONTEXT: ${{ steps.filter.outputs.docker-context }}
          F_AUTH: ${{ steps.filter.outputs.auth }}
          F_ENTRY: ${{ steps.filter.outputs.entry }}
          F_QUEUE: ${{ steps.filter.outputs.queue }}
          F_REGISTRATION: ${{ steps.filter.outputs.registration }}
          F_INSPECTION: ${{ steps.filter.outputs.inspection }}
          F_TRAFFIC: ${{ steps.filter.outputs.traffic }}
          F_SCORE: ${{ steps.filter.outputs.score }}
          F_DOCUMENTS: ${{ steps.filter.outputs.documents }}
          F_COMPETITION: ${{ steps.filter.outputs.competition }}
          F_COURSE: ${{ steps.filter.outputs.course }}
          F_CALENDAR: ${{ steps.filter.outputs.calendar }}
          F_EMAIL: ${{ steps.filter.outputs.email }}
          F_LANDING: ${{ steps.filter.outputs.landing }}
        run: |
          declare -A PORTS=([auth]=9100 [competition]=9200 [email]=9900 [course]=10000 [calendar]=11000)
          STANDARD=(auth competition email course calendar)
          RUNNERS=("ubuntu-latest:linux/amd64:amd64" "ubuntu-24.04-arm:linux/arm64:arm64")
          BUILD_INCLUDES=()
          SVC_INCLUDES=()

          add_service() {
            local svc=$1
            local port_arg=""
            if [ -n "${PORTS[$svc]+x}" ]; then
              port_arg=",\"port\":${PORTS[$svc]}"
              SVC_INCLUDES+=("{\"service\":\"$svc\"$port_arg}")
            else
              SVC_INCLUDES+=("{\"service\":\"$svc\"}")
            fi
            for r in "${RUNNERS[@]}"; do
              IFS=: read -r runner platform arch <<< "$r"
              BUILD_INCLUDES+=("{\"service\":\"$svc\"$port_arg,\"runner\":\"$runner\",\"platform\":\"$platform\",\"arch\":\"$arch\"}")
            done
          }

          if [ "$IS_DISPATCH" = "true" ]; then
            for svc in "${STANDARD[@]}"; do add_service "$svc"; done
            add_service "caddy"
          else
            competition_changed="$F_COMPETITION"
            for value in "$F_ENTRY" "$F_QUEUE" "$F_REGISTRATION" "$F_INSPECTION" "$F_TRAFFIC" "$F_SCORE" "$F_DOCUMENTS"; do
              if [ "$value" = "true" ]; then competition_changed=true; fi
            done
            declare -A FILTERS=(
              [auth]="$F_AUTH" [competition]="$competition_changed"
              [email]="$F_EMAIL" [course]="$F_COURSE" [calendar]="$F_CALENDAR"
            )
            for svc in "${STANDARD[@]}"; do
              if [ "${FILTERS[$svc]}" = "true" ] || [ "$SHARED" = "true" ] || [ "$DOCKERFILE_SVC" = "true" ] || [ "$DOCKER_CONTEXT" = "true" ]; then
                add_service "$svc"
              fi
            done
            if [ "$F_LANDING" = "true" ] || [ "$SHARED" = "true" ] || [ "$DOCKER_CONTEXT" = "true" ]; then
              add_service "caddy"
            fi
          fi

          if [ ${#BUILD_INCLUDES[@]} -eq 0 ]; then
            echo 'build-matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'services-matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          else
            BUILD_JSON=$(IFS=,; echo "${BUILD_INCLUDES[*]}")
            SVC_JSON=$(IFS=,; echo "${SVC_INCLUDES[*]}")
            echo "build-matrix={\"include\":[$BUILD_JSON]}" >> "$GITHUB_OUTPUT"
            echo "services-matrix={\"include\":[$SVC_JSON]}" >> "$GITHUB_OUTPUT"
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          # Route Docker Hub (docker.io) base-image pulls through Google's
          # pull-through mirror. A shared/ or Dockerfile change rebuilds every
          # service across both arches (~22 jobs), and anonymous Docker Hub
          # pulls rate-limit / 5xx at that volume — there are no Docker Hub
          # creds here. The mirror serves the same official base images
          # without the anonymous per-IP limit.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Set build config
        id: config
        run: |
          case "${{ matrix.service }}" in
            caddy)
              echo "dockerfile=landing/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "context=." >> "$GITHUB_OUTPUT"
              ;;
            competition)
              echo "dockerfile=competition/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "context=." >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "dockerfile=Dockerfile.service" >> "$GITHUB_OUTPUT"
              echo "context=." >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build and push by digest
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.config.outputs.context }}
          file: ${{ steps.config.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            ${{ matrix.port && format('SERVICE={0}', matrix.service) || '' }}
            ${{ matrix.port && format('PORT={0}', matrix.port) || '' }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }},mode=min,ignore-error=true

      # The gha cache backend intermittently 404s an evicted blob mid-import
      # ("BlobNotFound"), which fails the whole build even though the cache is
      # only a speedup. Retry once without cache-from so a corrupt/evicted cache
      # entry degrades to a cold build instead of a red main build; cache-to
      # still refreshes the scope (ignore-error keeps a failed export non-fatal).
      - name: Build and push by digest (retry without cache import)
        id: build_retry
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.config.outputs.context }}
          file: ${{ steps.config.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            ${{ matrix.port && format('SERVICE={0}', matrix.service) || '' }}
            ${{ matrix.port && format('PORT={0}', matrix.port) || '' }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-to: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }},mode=min,ignore-error=true

      - name: Export digest
        run: |
          digest="${{ steps.build.outputs.digest || steps.build_retry.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "::error::both build attempts produced no digest" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: [changes, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.services-matrix) }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.service }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest \
            $(printf 'ghcr.io/${{ github.repository }}/${{ matrix.service }}@sha256:%s ' *)

      - name: Delete orphaned versions
        uses: actions/github-script@v8
        with:
          script: |
            const pkg = 'formula-student-korea/${{ matrix.service }}';
            const image = 'luftaquila/formula-student-korea/${{ matrix.service }}';

            // Get referenced digests from current manifest list
            const tokenRes = await fetch(
              `https://ghcr.io/token?service=ghcr.io&scope=repository:${image}:pull`
            );
            const { token } = await tokenRes.json();
            const manifestRes = await fetch(
              `https://ghcr.io/v2/${image}/manifests/latest`,
              {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.index.v1+json'
                }
              }
            );
            const manifest = await manifestRes.json();
            const referenced = new Set(manifest.manifests.map(m => m.digest));

            // Delete untagged versions not referenced by manifest list
            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByAuthenticatedUser,
              { package_type: 'container', package_name: pkg }
            );
            for (const v of versions) {
              if (v.metadata.container.tags.length === 0 && !referenced.has(v.name)) {
                console.log(`Deleting orphaned: ${v.id} (${v.name})`);
                await github.rest.packages.deletePackageVersionForAuthenticatedUser({
                  package_type: 'container',
                  package_name: pkg,
                  package_version_id: v.id
                });
              }
            }
