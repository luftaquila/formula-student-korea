name: E2E Tests

on:
  push:
    tags: ["*"]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          JWT_SECRET=e2e-test-secret
          INTERNAL_SECRET=e2e-internal-secret
          ADMIN_EMAIL=e2e-admin@test.com
          GOOGLE_CLIENT_ID=dummy
          GOOGLE_CLIENT_SECRET=dummy
          PUBLIC_URL=http://localhost:9000
          EOF

      - name: Start services
        run: |
          docker compose up -d --wait auth entry queue inspection traffic score documents
          docker compose --profile local up -d --no-deps caddy-local
          sleep 3
          curl -sf http://localhost:9000/auth/api/health

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose --profile local down -v
