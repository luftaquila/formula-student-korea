name: E2E Tests

on:
  push:
    tags: ["*"]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          JWT_SECRET=e2e-test-secret
          INTERNAL_SECRET=e2e-internal-secret
          ADMIN_EMAIL=e2e-admin@test.com
          GOOGLE_CLIENT_ID=dummy
          GOOGLE_CLIENT_SECRET=dummy
          PUBLIC_URL=http://localhost:9000
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build images with cache
        uses: docker/bake-action@v6
        with:
          files: compose.yml
          targets: auth,entry,queue,inspection,traffic,score,documents,caddy-local
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
          load: true

      - name: Start services
        run: |
          docker compose up -d --wait --no-build auth entry queue inspection traffic score documents
          docker compose --profile local up -d --no-deps --no-build caddy-local
          sleep 3
          curl -sf http://localhost:9000/auth/api/health

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies and Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose --profile local down -v
