name: Build Rover MCU

on:
  push:
    branches: [main]
    paths:
      - 'course/rover/mcu/**'
      - '.github/workflows/rover-mcu.yml'
  pull_request:
    paths:
      - 'course/rover/mcu/**'
      - '.github/workflows/rover-mcu.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PICO_SDK_REF: '2.1.1'
  PICO_BOARD: 'pico'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            python3 \
            build-essential \
            git

      - name: Cache pico-sdk
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_REF }}

      - name: Clone pico-sdk
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${PICO_SDK_REF} \
            https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init --depth 1 \
            lib/tinyusb lib/cyw43-driver lib/lwip lib/btstack lib/mbedtls

      - name: Configure
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -G Ninja \
            -S course/rover/mcu \
            -B course/rover/mcu/build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPICO_BOARD=${PICO_BOARD}

      - name: Build
        run: cmake --build course/rover/mcu/build --parallel

      - name: Verify firmware artifacts
        run: |
          ls -la course/rover/mcu/build/rover_mcu.uf2
          ls -la course/rover/mcu/build/rover_mcu.elf
          arm-none-eabi-size course/rover/mcu/build/rover_mcu.elf

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: rover-mcu-firmware
          path: |
            course/rover/mcu/build/rover_mcu.uf2
            course/rover/mcu/build/rover_mcu.elf
            course/rover/mcu/build/rover_mcu.bin
          if-no-files-found: error
          retention-days: 30
