bridge_node:
  ros__parameters:
    server_url: ""                     # Course server URL (e.g., https://test.luftaquila.io/course)
    internal_secret: ""                # INTERNAL_SECRET for X-Internal-Service header
    position_report_interval: 1.0      # Seconds between position reports during navigation
    sse_reconnect_delay: 3.0           # Initial SSE reconnect delay (exponential backoff)

gps_node:
  ros__parameters:
    serial_port: "/dev/ttyACM0"        # ZED-F9P USB serial port
    baud_rate: 115200
    publish_rate: 10.0                 # Hz
    heading_speed_threshold: 0.3       # m/s minimum to publish heading
    ntrip:
      host: ""                         # NTRIP caster hostname (e.g., gnss.ngii.go.kr)
      port: 2101
      mountpoint: ""
      username: ""
      password: ""

motor_node:
  ros__parameters:
    # MDD10A GPIO pins (BCM numbering)
    dir1_pin: 23                       # Channel 1 (left motor) direction
    pwm1_pin: 24                       # Channel 1 (left motor) PWM
    dir2_pin: 27                       # Channel 2 (right motor) direction
    pwm2_pin: 22                       # Channel 2 (right motor) PWM
    # S20F steering servo
    steering_pin: 12                   # Steering servo GPIO pin (hardware PWM)
    servo_center_us: 1500              # Center pulse width (microseconds)
    servo_range_us: 500                # Range from center (+/- for full lock)
    # Robot geometry
    max_steering_angle: 25.0           # Maximum steering angle (degrees)
    wheelbase: 0.38                    # Front-to-rear axle distance (meters)
    track_width: 0.30                  # Left-to-right wheel distance (meters)
    max_speed: 1.5                     # Maximum speed (m/s)
    # Safety
    watchdog_timeout: 0.5              # Seconds without command before auto-stop
    accel_limit: 0.5                   # Maximum acceleration (m/s^2)
    gpio_chip: 4                       # GPIO chip number (RPi5 RP1 = 4)

navigator_node:
  ros__parameters:
    waypoint_tolerance: 0.05           # Meters to consider waypoint reached (5cm)
    approach_tolerance: 0.30           # Meters to switch to precision approach
    calibration_distance: 2.5          # Meters to drive for heading calibration
    calibration_speed: 0.3             # m/s during calibration
    cruise_speed: 1.2                  # m/s during normal navigation
    approach_speed: 0.2                # m/s during precision approach
    lookahead_min: 0.3                 # Minimum Pure Pursuit lookahead (meters)
    lookahead_gain: 0.5                # Lookahead = gain * speed
    heading_calibrated_threshold: 5.0  # Degrees, max variance for calibrated heading
    gps_timeout: 3.0                   # Seconds without GPS before ERROR state
    return_to_start: true              # Return to starting position after last waypoint
    stuck_timeout: 10.0                # Seconds without progress before retry/skip
    stuck_max_retries: 2               # Max retries before skipping waypoint
    spray_timeout: 5.0                 # Seconds to wait for spray_done before auto-skip
    creep_speed: 0.05                  # m/s during position correction creep
    decel_distance: 2.0                # Meters from waypoint to start decelerating
    settle_readings: 5                 # Consecutive GPS readings to confirm settled position
    settle_tolerance: 0.03             # Meters for tight settle confirmation (3cm)
    settle_timeout: 10.0               # Seconds before settling gives up and sprays anyway
    required_fix_status: "rtk_fixed"   # Minimum GPS fix quality required to start/resume mission

spray_node:
  ros__parameters:
    servo_pin: 13                      # Spray servo GPIO pin (HW PWM channel 1)
    spray_angle: 90                    # Servo angle for spray position (degrees)
    rest_angle: 0                      # Servo angle for rest position (degrees)
    spray_duration: 0.5                # Seconds to hold spray position
    retract_delay: 0.3                 # Seconds to wait after retract before done
    gpio_chip: 4                       # GPIO chip number (RPi5 RP1 = 4)
