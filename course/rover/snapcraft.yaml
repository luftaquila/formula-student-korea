name: fsk-rover-pilot
base: core24
version: "0.1.0"
summary: ROS 2 pilot stack for the Formula Student Korea rover
description: |
  Monolithic Ubuntu Core snap for the rover.
  The snap packages the ROS 2 Pilot workspace, launches it as a daemon at boot,
  and keeps the default rover configuration inside the snap.

grade: stable
confinement: strict

apps:
  pilot:
    command: bin/run-pilot
    daemon: simple
    restart-condition: on-failure
    extensions: [ros2-jazzy]
    plugs:
      - network
      - network-bind
      - raw-usb
      - serial-port
      - gpio
      - i2c

# Pi 5 cooling fan is pinned to 100% at the firmware level via
# `dtparam=fan_temp*` lines appended to `ubuntu-seed/config.txt` during
# image assembly (see `.github/workflows/rover-image.yml`). No snap-side
# daemon or super-privileged plug is involved, which keeps the snap's
# confinement within the set of interfaces the Snapcraft Store auto-
# approves.

hooks:
  configure:
    plugs: [network-setup-control]

parts:
  pilot:
    plugin: colcon
    source: ./pilot
    stage-packages:
      - ros-jazzy-ros2launch
      - python3-serial
      - python3-requests
      - python3-lgpio
      # Runtime BLAS/LAPACK backend for numpy. ros2-jazzy's Python
      # message bindings (`sensor_msgs`, `geometry_msgs`,
      # `rcl_interfaces`, ...) transitively `import numpy`, numpy's C
      # extension dlopens `libblas.so.3` and `liblapack.so.3`, and
      # without these lines snapcraft doesn't stage them — every ROS
      # node then crashes at import time and the `pilot` wrapper stays
      # "active" despite every child having died.
      - libblas3
      - liblapack3
      - libopenblas0-pthread
    override-prime: |
      craftctl default
      # Ubuntu's BLAS/LAPACK packages ship the actual SONAMEs inside
      # `/usr/lib/<triplet>/{blas,lapack,openblas-pthread}/` and rely
      # on `update-alternatives` to place symlinks one directory up
      # where the dynamic loader expects them. Alternatives do not run
      # during snap assembly, so we wire the symlinks by hand and fix
      # openblas as the chosen implementation (arm64-tuned, matches
      # what python3-numpy is built against).
      cd usr/lib/aarch64-linux-gnu
      ln -sf openblas-pthread/libblas.so.3 libblas.so.3
      ln -sf openblas-pthread/liblapack.so.3 liblapack.so.3
      ln -sf openblas-pthread/libopenblas.so.0 libopenblas.so.0

  launchers:
    plugin: dump
    source: ./snap
    organize:
      bin/run-pilot: bin/run-pilot
      hooks/configure: meta/hooks/configure
    prime:
      - bin/run-pilot
      - meta/hooks/configure
