name: fsk-rover-pilot
base: core24
version: "0.1.0"
summary: ROS 2 pilot stack for the Formula Student Korea rover
description: |
  Monolithic Ubuntu Core snap for the rover.
  The snap packages the ROS 2 Pilot workspace, launches it as a daemon at boot,
  and keeps the default rover configuration inside the snap.

grade: stable
confinement: strict

apps:
  pilot:
    command: bin/run-pilot
    daemon: simple
    restart-condition: on-failure
    extensions: [ros2-jazzy]
    plugs:
      - network
      - network-bind
      - raw-usb
      - serial-port
      - gpio
      - i2c
  fan-max:
    # Pi 5's stock thermal governor keeps the fan off until ~50°C and only
    # ramps to 100% near 75°C, which leaves the passive heatsink cooking
    # under sustained ROS 2 load. This daemon forces the fan to full-on at
    # all times via hwmon pwm1 + thermal cooling_device cur_state.
    command: bin/fan-max
    daemon: simple
    restart-condition: always
    plugs:
      - hardware-observe
      - fan-control

plugs:
  fan-control:
    interface: system-files
    write:
      # AppArmor enforces write rules against the post-symlink-resolution
      # path, so each symlink entrypoint in /sys/class/ needs its real
      # target covered too:
      #   /sys/class/hwmon/hwmon*/pwm1            → /sys/devices/platform/…
      #   /sys/class/thermal/cooling_device*/…    → /sys/devices/virtual/thermal/…
      # Miss either and `fan-max` hits "Permission denied" on the denied
      # leg, which previously showed up as the fan visibly ramping down
      # every few seconds (hwmon write OK, cooling_device write denied).
      - /sys/class/thermal
      - /sys/class/hwmon
      - /sys/devices/platform
      - /sys/devices/virtual/thermal

hooks:
  configure:
    plugs: [network-setup-control]

parts:
  pilot:
    plugin: colcon
    source: ./pilot
    stage-packages:
      - ros-jazzy-ros2launch
      - python3-serial
      - python3-requests
      - python3-lgpio

  launchers:
    plugin: dump
    source: ./snap
    organize:
      bin/run-pilot: bin/run-pilot
      bin/fan-max: bin/fan-max
      hooks/configure: meta/hooks/configure
    prime:
      - bin/run-pilot
      - bin/fan-max
      - meta/hooks/configure
