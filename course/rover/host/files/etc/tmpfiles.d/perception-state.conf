# Bind-mount source for the perception container's persistent state. Created at
# boot (systemd-tmpfiles) so it exists before perception.service starts. Holds
# /var/lib/perception/stereo_calib.npz (one-time stereo calibration written by
# stereo_calibrate.py; see course/rover/perception/README.md).
d /var/lib/perception 0755 root root -
