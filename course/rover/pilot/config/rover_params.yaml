bridge_node:
  ros__parameters:
    server_url: ""                     # Course server URL (e.g., https://test.luftaquila.io/course). MUST be https.
    # internal_secret is injected via INTERNAL_SECRET env var; never commit.
    # server_url_allow_http defaults to false. Only set true on trusted internal (e.g. Tailscale) networks.
    server_url_allow_http: false
    position_report_interval: 1.0      # Seconds between position reports (always, even when idle)
    sse_reconnect_delay: 3.0           # Initial SSE reconnect delay (exponential backoff)

gps_node:
  ros__parameters:
    serial_port: "/dev/ttyGPS"         # udev symlink (see host/files/usr/lib/udev/rules.d/99-fsk-rover.rules)
    baud_rate: 115200
    publish_rate: 10.0                 # Hz
    heading_speed_threshold: 1.5       # m/s minimum to publish heading-of-motion. At 1.5 m/s, atan2 over a 15 cm displacement with ±1 cm RTK noise gives ±5° heading noise — fusable with a low gain. Below 1.5 m/s the noise exceeds ±8° and gets DROPPED entirely; chassis_psi at low speed is maintained by wheel-encoder yaw rate (predict) and the position-innovation ψ correction (estimator.correct_position_with_yaw_innovation), which is what ArduPilot EKF3 does on single-antenna RTK rovers without an IMU. Aligned with estimator_psi_min_speed.
    # NOTE: the NTRIP username MUST be injected via the NTRIP_USERNAME env
    # var (sourced from a podman secret in the rover image), never committed
    # to this file. Leave blank here so the repo stays safe to publish.
    ntrip:
      # Caster host/port/password are hard-coded constants in gps_node.py
      # because the rover only ever targets NGII (www.gnssdata.or.kr:2101)
      # whose shared RTK login uses the fixed password "gnss". Only the
      # per-operator username is configurable, and mountpoint is auto-
      # selected at runtime by nearest-base-station lookup against the
      # caster's source table.
      username: ""
      gga_interval_s: 10.0             # Seconds between GGA heartbeats to the caster

navigator_node:
  ros__parameters:
    # ── Antenna geometry ────────────────────────────────────────────────
    # Body-frame offset from rear-axle centre to GPS antenna phase centre.
    # Positive x = ahead of rear axle; positive y = LEFT of centerline.
    # Measure with a tape on the actual chassis — this is the only knob
    # the antenna-precise docking depends on.
    antenna_offset_x: 0.30             # meters
    antenna_offset_y: 0.00             # meters

    # ── Chassis geometry ────────────────────────────────────────────────
    # Mirrors mcu_bridge's authoritative copies; navigator needs them for
    # the kinematic model and curvature clamp. Tape-measured 2026-05-08
    # (front-axle to rear-axle ≈ rear-wheel-to-rear-wheel ≈ 330 mm); old
    # values 0.38 / 0.30 were placeholder defaults from an earlier rev of
    # the chassis and made the antenna-cal closed-form solver miss by 25 %
    # because chassis κ was over-commanded against the assumed wheelbase
    # while ω was under-measured against the assumed track.
    wheelbase: 0.33                    # meters
    track_width: 0.33                  # meters
    max_steering_angle_deg: 30.5       # iteratively converged on cal data: 25 → 28.5 left 7 % R mismatch; 28.5 → 30.5 closes that down to noise floor (sweep ratio 1.07 → ~1.0)
    max_curvature: 1.7                 # 1/m. Physical limit tan(30.5°)/0.33 ≈ 1.78.
    servo_range_us: 500                # mirrors mcu_bridge_node.servo_range_us — used by
                                       # CAL_WHEELS' steering-trim solve to convert κ_bias to µs.

    # ── Speeds ──────────────────────────────────────────────────────────
    cruise_speed: 1.0                  # m/s during cruise segments
    approach_speed: 0.4                # m/s on the dock corridor (precision)
    creep_speed: 0.10                  # m/s for fine corrections / overshoot reverse. Halved from 0.18 so the chassis can stop within approach_tolerance instead of rolling several cm past on inertia + PID lag at the dock 'reached' threshold.
    calibration_speed: 0.5             # m/s during cold-start heading discovery. Independent of heading_speed_threshold — calibration uses fit_chord_heading on GPS antenna ENU positions, not GPS heading-of-motion.
    # Antenna offset auto-calibration STRAIGHT phase chord length. Drives
    # κ=0 for this distance, fits ψ_init from antenna ENU. 2 m gives a
    # chord well above the 1.5 m calibration_chord_min_m gate even when
    # the operator starts on slightly uneven ground.
    antenna_cal_straight_distance: 2.0

    # Antenna offset auto-cal drive speed. v = 0.5 m/s on R = 1.5 m keeps
    # lateral acceleration v²/R ≈ 0.17 m/s², low enough that wheel slip /
    # tyre scrub doesn't corrupt the encoder ω integration the closed-form
    # solver depends on (a 1.0 m / 0.8 m/s drive at 0.64 m/s² lat acc gave
    # 32% sweep mismatch between chassis encoder and antenna GPS — chassis
    # encoder under-counted rotation due to scrub).
    antenna_cal_speed: 0.5

    # Antenna offset auto-cal orbit shape. R = 1.5 m gives κ = 0.667 m⁻¹,
    # well inside the chassis curvature cap (1.2). Two revolutions at v =
    # 0.5 m/s = ~38 s, sampling ~380 GPS fixes (plenty for the closed-form
    # circle fits). Drive footprint ~ 3 m diameter + chassis ≈ 4 m × 4 m.
    antenna_cal_radius_m: 1.5
    antenna_cal_revolutions: 2
    # Rotation direction: +1 CCW (left turn), -1 CW. CCW first because that
    # was the SCURVE convention; flip if site geometry requires.
    antenna_cal_sign: 1

    # ── Path planner ────────────────────────────────────────────────────
    dock_approach_distance: 2.5        # meters of straight line before the dock pose. Lengthened from 1.5 so chassis has room to rotate into corridor heading inside the cruise leg before handing off to dock — critical when consecutive waypoints sit at 60°+ relative bearings (cruise from prev-dock-end with chassis ψ way off corridor; PP and Stanley both drift across the corridor before aligning, and the dock then opens at e_y ~30cm). 2.5m gives 4×min-turning-radius (0.56m) of room.

    # ── Path tracker selector ──────────────────────────────────────────
    # Stage 2 architecture: 'l1' enables L1Tracker (Park 2007 +
    # Macenski regulated PP) on both cruise and dock segments,
    # replacing CruiseTracker + DockTracker. 'legacy' keeps the
    # original two-tracker stack for field rollback in a single
    # yaml flip. The legacy stack STAYS in the codebase until Stage
    # 3 cleanup after three successful L1 missions.
    path_tracker_kind: "l1"

    # ── L1 tracker tuning (path_tracker_kind == 'l1') ──────────────────
    # L1 lookahead time-constant. v=1.0 m/s → L1 = 0.7071/π·2.5·1.0 ≈
    # 0.56 m (clamped up to l1_min). At v=2.0 → 1.13 m. Period of 2.5 s
    # is ArduPilot's typical rover setting; damping 1/√2 is the
    # critical-damping pick.
    l1_period_s: 2.5
    l1_damping: 0.7071
    l1_min_m: 0.6                      # lookahead floor — keeps creep dock in tight closure
    l1_max_m: 4.0                      # lookahead cap — prevents the carrot from running off the end of a short cruise leg

    # cm-precision capture radius on dock segments. Matches
    # settle_tolerance so the single 3 cm gate decides BOTH the dock
    # 'reached' status and the spray confirmation — no dead band
    # between approach_tolerance and waypoint_tolerance like the
    # legacy stack had.
    l1_cm_capture_m: 0.03
    l1_reverse_recovery_min_m: 0.08    # adaptive recovery distance floor (overshoot ≤ 4 cm → 8 cm reverse; 5 cm → 10 cm; 10 cm → 20 cm)
    l1_reverse_speed: 0.10             # m/s magnitude during reverse-recovery
    l1_kappa_speed_lim: 0.85           # 1/m — half of max_curvature; speed regulates as min(1, lim/|κ|)
    l1_e_y_speed_gain: 2.0             # linear cross-track speed cut: speed *= max(floor, 1 - gain·|e_y|)
    l1_e_y_speed_floor: 0.4            # floor of the e_y speed scale (keeps chassis moving even on big residuals)
    # Target-distance brake. Sized for MCU PID lag (cmd→actual ≈ 0.5 s) + accel_limit 0.8 m/s². 50 cm zone gives the PID enough time to ramp chassis v from approach_speed (0.40) down to brake_min_frac × 0.40 = 0.07 m/s by the time the antenna crosses cm_capture (3 cm) — so the post-trigger inertia stop distance is ~0.6 cm instead of the 16 cm we measured with the previous 20 cm zone (15:00 mission WP1: cm_capture fired at chassis dist ≈ 3 cm but chassis kept moving with real v ≈ 0.20 m/s for 0.5 s, landing 19 cm past target).
    l1_brake_zone_m: 0.50
    l1_brake_min_speed_frac: 0.175
    # Hard floor on commanded forward speed in the brake zone. Decoupled from `creep_speed` (legacy DockTracker uses creep_speed as the speed BEFORE brake modulation). Matches legacy effective floor 0.07 m/s.
    l1_min_speed_m_s: 0.07
    # Close-but-not-cm-precise tolerance: if antenna is within this distance of target after a settle timeout or stuck detection, accept the landing and spray rather than replan/retry. 5 cm matches the spray cone budget tightly — 20-30 cm landings are unacceptable mission output (the prior 30 cm value let WPs fire spray that far off target). Anything beyond 5 cm forces L1 to re-engage its internal reverse-recovery / K-turn for another approach.
    l1_close_enough_spray_m: 0.05
    # Sharp-turn lookahead boost. When the chassis enters a fresh L1 segment with its heading more than this many radians off the segment direction (typical case: 90° WP-to-WP turn where chassis is still pointed along the previous corridor), boost the L1_min floor so the lookahead pulls a gentle arc instead of saturating κ. 0.785 rad ≈ 45°: directly-back angles auto-trigger but small lateral wobbles don't.
    l1_sharp_turn_thresh_rad: 0.785
    # L1_min when sharp-turn boost is active. Linear interp from this value at the threshold up to l1_max at 180° opposed. At 90° (halfway) lookahead lands mid-way (~2.6 m), wide enough to keep κ below saturation on a true U-turn case.
    l1_sharp_turn_l1_min_m: 1.2
    # Seconds of forward-only lockout after exiting reverse-recovery. Prevents the near-target reverse/forward ping-pong where along_to_target flips sign every tick and chassis κ alternates ±max each 50 ms — the 14:22 WP4 trace had 30+ such oscillations before stuck. 1.5 s lets the brake_zone ramp settle into the chassis before a new reverse decision.
    l1_reverse_lockout_s: 1.5

    # ── Cruise tracker (heading-only goal-seeking P-controller) ─────────
    # The cruise tracker is now a human-driver-style heading regulator
    # toward the dock corridor entry. There is no path-following lateral
    # term — chassis position noise cannot enter κ. Reed-Shepp planning,
    # sub-seg expansion, zero-cross gating, and lateral-handoff replan
    # logic have all been removed; the planner emits exactly one cruise
    # segment per waypoint with start_pose = chassis pose at plan time
    # and end_pose = dock entry.
    cruise_done_tolerance: 0.20        # meters from end pose to declare cruise done (chassis inside this distance AND heading-aligned within heading_max → handoff to dock)
    cruise_done_heading_max_rad: 0.14  # ~8°. Tightened from 15° — the 14:03 trace handed off with chassis 15° off ψ_dock and dock immediately saturated correcting. 8° leaves only ±0.4 cm/s lateral drift at v=0.4 inside the dock corridor, well below settle_tol budget.
    cruise_pass_through_m: 0.30        # meters of past-end overshoot along the start→end bearing that forces done. Safety net so the chassis cannot orbit a goal that ended up just behind it.
    cruise_k_heading: 1.5              # rad/m per rad of heading error. κ = k_heading · (bearing_to_goal − chassis_ψ), clamped to ±max_curvature. 1.5 keeps κ small (≈ ±0.13 rad/m, ≈ ±2.5° steering) at 5° heading-error noise, well below visible chassis wiggle threshold; saturates at e_psi ≈ 65° so big turns close in a single smooth arc.
    cruise_min_speed_fraction: 0.40    # floor on the cos(e_psi) speed scale. 0.40 means commanded speed never drops below 0.40 × cruise_speed even at 180° heading error, so the chassis keeps moving (rather than freezing) while it U-turns under saturated κ.
    cruise_carrot_lookahead_m: 0.60    # meters ahead of the dock corridor entry to put the steer-toward 'carrot'. As the chassis approaches the entry, the bearing-to-carrot converges to ψ_dock (corridor heading) because the carrot sits INSIDE the corridor — chassis aligns naturally and the cruise→dock handoff opens with e_y, e_psi ≈ 0. Sized to ~chassis turning radius so the heading regulator's target is always inside the reachable arc.
    cruise_orbit_gate_dist_m: 0.40     # meters — when chassis is closer than this to the dock entry AND its heading is more than 90° off the bearing-to-entry, the cruise tracker declares done. Pure-pursuit cannot forward-arc to a goal inside the turning circle (14:03 WP5 trace: 4 minutes of orbit when the original dock failed to land and the replan placed a 0.4 m entry behind the chassis facing the opposite direction). Handing off to the dock lets its reverse-recovery back the chassis up and re-approach.

    # ── Dock tracker (state-feedback line follower) ─────────────────────
    dock_k_y: 6.0                      # 1/m — legacy P-gain on antenna lateral error, retained for backward compat. The Stanley refinement uses dock_stanley_k_lat instead; dock_k_y is only consulted as the upper-bound fallback when dock_stanley_k_lat is absent.
    dock_stanley_k_lat: 2.0            # Stanley arctan gain for the dock tracker. Halved 4→2: at v=0.4 m/s, k=4 with e_y=5 cm produced desired_offset=atan(4·0.05/0.5)=39° → 15° cap; combined with k_psi=5 it drove κ to saturation on any minor lateral disturbance, and chassis dynamics couldn't track the saturated κ command → sign-flipping limit cycle every WP dock (14:03 trace: e_y +2.9 → -6.4 → +3.5 → +6.4 → -10.7 across 5 ticks under saturated ±1.70 κ). k=2 gives desired_offset=22° at the same e_y, still above the 15° cap on big residuals but inside the cap for ≤4 cm e_y, so small disturbances don't saturate.
    dock_k_psi: 2.0                    # 1/m — gain on chassis heading error vs path. Halved 5→2 for the same reason: at e_psi=20° the contribution drops from -1.75 to -0.70 rad/m, well clear of the curvature cap so chassis dynamics can actually track the command. Steady-state arc tracking unaffected because dock corridors are straight.
    dock_k_i: 0.4                      # 1/(m·s) — integral on antenna lateral error. Cancels constant κ-bias from antenna-offset residual / mast tilt / slope.
    dock_integral_limit: 0.5           # m·s — clamp on the integral state. Also acts as the anti-windup mechanism: during sustained κ-saturation the integral pumps up to ±limit and stops, bounding the kappa contribution k_i × limit regardless of how long saturation persists.
    dock_stanley_offset_cap_rad: 0.262 # ~15°. Caps desired_offset so the dock tracker doesn't drive perpendicular to the corridor on large lateral residuals.
    dock_reverse_recovery_m: 0.08      # meters behind the target (along corridor) to back up to before re-engaging forward control after an along-track overshoot. Tight cycle (4 cm back, 4 cm forward) prevents 20 cm slingshot.
    dock_brake_zone_m: 0.12            # Doubled 6→12 cm. The 14:03 WP5 trace shows the dock crossing 'reached' (along<0, dist≤4.5 cm) at v=0.07 m/s with 6 cm brake_zone, then bouncing into reverse-recovery because the chassis couldn't stop in time. Wider 12 cm brake_zone gives the MCU 12·0.05=0.6 s to ramp setpoint smoothly from approach_speed to brake_min × creep_speed before crossing target, eliminating the reverse-forward limit cycle.
    dock_brake_min_speed_frac: 0.70    # creep_speed 0.10 × 0.70 = 0.07 m/s, comfortably above the MCU PID deadband 0.05 m/s. Going below deadband (the 0.30 attempt) made the chassis stop dead 6 cm short of target — frozen with the antenna slightly off. Keep the chassis moving under power until the dock's reach condition fires; the 12 cm brake_zone is what gives the MCU time to decelerate from approach_speed=0.4 down to 0.07 inside the zone (decel distance ≈ 10 cm at accel_limit=0.8 m/s²), so the chassis crosses the target at the controlled 0.07 m/s with bounded overshoot < 0.3 cm.
    dock_reverse_stall_timeout_s: 5.0  # seconds in reverse before checking displacement. If chassis rotates in place under saturated latched κ instead of backing up, the watchdog bails to navigator for replan.
    dock_reverse_stall_min_disp_m: 0.30  # minimum chassis displacement (m) during a reverse stroke before stall is declared. 0.30 m = 6 cm/s average over 5 s, well below the 0.10 m/s commanded creep — anything less means the chassis isn't translating.
    approach_tolerance: 0.03           # antenna-to-target distance to declare dock reached. Matched to settle_tolerance — the new dock logic stops on raw distance (no along-track gate), so this directly bounds final landing.
    creep_zone: 0.40                   # meters from target to drop from approach_speed to creep_speed

    # ── Tolerances and timeouts ─────────────────────────────────────────
    waypoint_tolerance: 0.03           # meters antenna-to-target to consider waypoint hit. Matched to settle_tolerance (3 cm) under the L1Tracker design — single threshold removes the dead band where settle_tol < dist <= waypoint_tolerance left neither branch of the settle handler doing anything. L1's cm_capture is also 3 cm so the controller stops on the same gate the navigator sprays on.
    settle_tolerance: 0.03             # meters for tight settle confirmation
    settle_readings: 8                 # consecutive in-tolerance readings to declare settled (was 5; 8 × 50 ms = 400 ms washes out chassis decel + mast ringing)
    settle_timeout: 2.0                # seconds. SETTLING just confirms N consecutive readings inside settle_tol after cm_capture fires — chassis is already stopped (cmd v=0). The old 12 s was a legacy DockTracker leftover where reverse-recovery cycles needed time to converge inside the corridor; L1 mode has no such cycles in SETTLING (chassis is stationary, only RTK noise moves the antenna ±1 cm). 2 s = 4 × settle_readings × 50 ms window plus RTK-noise headroom. Anything longer was idle wait the operator (rightly) called "조작도 안 하고 가만히 있을 거면" pointless.
    active_settle_throttle_s: 1.5      # seconds — minimum interval between active-settle retries when dock drifts back outside waypoint_tolerance. Stops the navigator from cycling SETTLING→NAVIGATING in 50 ms ticks on a dock that declares 'reached' immediately on re-engagement.
    spray_timeout: 5.0                 # seconds to wait for spray_done before auto-skip
    stuck_timeout: 12.0                # seconds without progress before retry/skip
    stuck_max_retries: 2

    # ── Calibration quality gates ───────────────────────────────────────
    calibration_distance: 2.5          # meters of straight drive
    calibration_max_distance: 5.0      # meters cap — ERROR if heading still untrustworthy
    calibration_min_samples: 20        # ≥1 second at 20 Hz
    calibration_chord_min_m: 1.5       # require this chord length for trustworthy heading fit
    calibration_residual_max: 0.05     # meters RMS of perpendicular residuals (~2° heading 1σ at 1.5 m chord)

    # ── Wheel scale auto-calibration (CAL_WHEELS state) ─────────────────
    wheel_cal_distance: 10.0           # meters of straight drive to converge on (GPS chord)
    wheel_cal_speed: 0.5               # m/s during the calibration drive
    wheel_cal_max_distance: 15.0       # cap — give up if 15 m elapsed without resolving

    # ── State estimator ─────────────────────────────────────────────────
    estimator_pos_gain: 0.30           # blend factor for GPS antenna position correction
    estimator_psi_gain: 0.08           # blend factor for GPS heading-of-motion (high-speed observation). Lowered 0.30→0.08 because we now have a SECOND ψ observation (position-innovation, see yaw_innov_gain below) that handles the low-speed regime where heading-of-motion would inject too much noise. Heading-of-motion is now a slow drift correction at high speed only.
    estimator_psi_min_speed: 1.5       # m/s below which heading-of-motion is dropped entirely. At 1.5 m/s the displacement between consecutive 10 Hz GPS fixes is 15 cm, so atan2(dy, dx) with ±1 cm RTK noise gives ±4° heading noise — fusable with the low 0.08 gain. Below 1.5 m/s, chassis_psi is maintained by encoder yaw-rate integration (predict) + position-innovation ψ correction (correct_position_with_yaw_innovation).
    estimator_yaw_innov_gain: 0.10     # Position-innovation → ψ correction gain. After encoder DR predicts the antenna's ENU, the GPS-measured antenna position reveals a residual; the component PERPENDICULAR to chassis heading is yaw error × DR arc. ArduPilot EKF3 uses this exact channel on encoder-only RTK rovers without an IMU. 0.10 with the ±5° per-fix cap converges a 5° ψ bias in 4-6 GPS fixes.
    estimator_yaw_innov_min_speed: 0.3 # Below this commanded speed, the DR arc per GPS fix is too short to overcome the ±1 cm RTK position noise — the lateral residual is noise-dominated, not ψ-dominated. 0.3 m/s × 0.1 s = 3 cm arc, which is just above the 1 cm noise band; safe to fuse.

    # ── Safety ──────────────────────────────────────────────────────────
    gps_timeout: 3.0                   # seconds without GPS before ERROR
    fix_hysteresis_s: 0.8              # seconds of bad fix tolerated before ERROR
    required_fix_status: "rtk_fixed"
    # When the live fix is rtk_float (integer ambiguity unresolved), accept
    # it if reported horizontal accuracy is at or below this many mm.
    # 0 disables — falls back to fixed-only behaviour. Operator policy
    # (2026-05-15): rtk_fixed ONLY. Float fixes have unresolved integer
    # ambiguities and can drift several cm even at small reported hAcc;
    # navigation under float caused chassis-pose jumps in the 14:22
    # mission trace (13 GPS quality drops in one mission) that triggered
    # ERROR → reverse-recovery → stuck loops. With float disabled, the
    # navigator HOLDS POSITION whenever the fix degrades and only resumes
    # once rtk_fixed is restored.
    fix_accept_float_max_h_acc_mm: 0
    return_to_start: true

    # Battery state-of-charge gates (the MCU has its own hard cutoff at
    # BATTERY_UNDERVOLT_V=20 V; these stop the navigator earlier so motors
    # don't cut out mid-dock).
    battery_warn_pct: 20               # below this, refuse to start a new mission
    battery_abort_pct: 10              # below this, abort an active mission and ERROR

spray_node:
  ros__parameters:
    servo_pin: 13                      # Spray servo GPIO pin (HW PWM channel 1)
    spray_angle: 90                    # Servo angle for spray position (degrees)
    rest_angle: 0                      # Servo angle for rest position (degrees)
    spray_duration: 0.5                # Seconds to hold spray position
    retract_delay: 0.3                 # Seconds to wait after retract before done
    gpio_chip: 4                       # GPIO chip number (RPi5 RP1 = 4)

mcu_bridge_node:
  ros__parameters:
    # USB CDC link to the RP2040 coprocessor (course/rover/mcu/).
    serial_port: "/dev/ttyMCU"         # udev symlink (see scripts/99-fsk-rover.rules)
    baud_rate: 115200                  # USB CDC ignores this but pyserial requires it
    heartbeat_hz: 10.0                 # MCU Pi-link WDT = 500 ms
    reconnect_delay_s: 2.0
    # Ackermann + steering servo
    servo_center_us: 1500
    servo_range_us: 500
    max_steering_angle_deg: 30.5
    wheelbase: 0.33                    # tape-measured 2026-05-08
    track_width: 0.33                  # tape-measured 2026-05-08
    # Operator-measured open-loop top speed at 100% duty is ~2.3 m/s on
    # this drivetrain at full LiFePO4. Cap was previously 1.5, which forced
    # PID setpoint at full manual throttle to 1.5 (since target_speed =
    # throttle_pct/100 × max_speed). Raised to 2.5 so PID can issue the
    # full-duty setpoint manual control expects.
    max_speed: 2.5
    # accel_limit applies to chassis longitudinal speed (m/s²), NOT to
    # per-wheel duty as the previous implementation did. Ramping per duty
    # killed the Ackermann differential during the first ~1.5s of every
    # turn — the rover scrubbed instead of arcing cleanly. Now the
    # steering servo applies κ instantly and only v ramps.
    accel_limit: 0.8
    manual_priority_s: 1.0
    # PID closed loop on the MCU. ON.
    # Gains tuned on the bench (jacked-up, step responses across
    # 0.3-1.2 m/s targets). With kp=1.0, ki=3.0:
    #   * steady-state error ~ -3 % (consistent across speed range)
    #   * overshoot < 2 % even on hardest step
    #   * rise time 0.1-0.5 s
    # kp ≥ 4 produced strong oscillation (Ku ≈ 3-4, picked 0.45·Ku);
    # kd left at 0 because derivative-on-measurement on a noisy
    # encoder amplifies more noise than it dampens for a system this
    # small. Drive-only sign clamp + 0.05 m/s deadband in the MCU
    # firmware handle the stop-on-zero behaviour so PID never
    # reverse-PWMs the wheels.
    use_pid: true
    pid_kp: 1.0
    pid_ki: 3.0
    pid_kd: 0.0
