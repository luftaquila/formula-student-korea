bridge_node:
  ros__parameters:
    server_url: ""                     # Course server URL (e.g., https://test.luftaquila.io/course). MUST be https.
    # internal_secret is injected via INTERNAL_SECRET env var; never commit.
    # server_url_allow_http defaults to false. Only set true on trusted internal (e.g. Tailscale) networks.
    server_url_allow_http: false
    position_report_interval: 1.0      # Seconds between position reports (always, even when idle)
    sse_reconnect_delay: 3.0           # Initial SSE reconnect delay (exponential backoff)

gps_node:
  ros__parameters:
    serial_port: "/dev/ttyGPS"         # udev symlink (see host/files/usr/lib/udev/rules.d/99-fsk-rover.rules)
    baud_rate: 115200
    publish_rate: 10.0                 # Hz
    heading_speed_threshold: 0.4       # m/s minimum to publish heading. Aligned with estimator_psi_min_speed so we don't publish headings the estimator immediately discards.
    # NOTE: the NTRIP username MUST be injected via the NTRIP_USERNAME env
    # var (sourced from a podman secret in the rover image), never committed
    # to this file. Leave blank here so the repo stays safe to publish.
    ntrip:
      # Caster host/port/password are hard-coded constants in gps_node.py
      # because the rover only ever targets NGII (www.gnssdata.or.kr:2101)
      # whose shared RTK login uses the fixed password "gnss". Only the
      # per-operator username is configurable, and mountpoint is auto-
      # selected at runtime by nearest-base-station lookup against the
      # caster's source table.
      username: ""
      gga_interval_s: 10.0             # Seconds between GGA heartbeats to the caster

navigator_node:
  ros__parameters:
    # ── Antenna geometry ────────────────────────────────────────────────
    # Body-frame offset from rear-axle centre to GPS antenna phase centre.
    # Positive x = ahead of rear axle; positive y = LEFT of centerline.
    # Measure with a tape on the actual chassis — this is the only knob
    # the antenna-precise docking depends on.
    antenna_offset_x: 0.30             # meters
    antenna_offset_y: 0.00             # meters

    # ── Chassis geometry ────────────────────────────────────────────────
    # Mirrors mcu_bridge's authoritative copies; navigator needs them for
    # the kinematic model and curvature clamp. Tape-measured 2026-05-08
    # (front-axle to rear-axle ≈ rear-wheel-to-rear-wheel ≈ 330 mm); old
    # values 0.38 / 0.30 were placeholder defaults from an earlier rev of
    # the chassis and made the antenna-cal closed-form solver miss by 25 %
    # because chassis κ was over-commanded against the assumed wheelbase
    # while ω was under-measured against the assumed track.
    wheelbase: 0.33                    # meters
    track_width: 0.33                  # meters
    max_steering_angle_deg: 30.5       # iteratively converged on cal data: 25 → 28.5 left 7 % R mismatch; 28.5 → 30.5 closes that down to noise floor (sweep ratio 1.07 → ~1.0)
    max_curvature: 1.7                 # 1/m. Physical limit tan(30.5°)/0.33 ≈ 1.78.
    servo_range_us: 500                # mirrors mcu_bridge_node.servo_range_us — used by
                                       # CAL_WHEELS' steering-trim solve to convert κ_bias to µs.

    # ── Speeds ──────────────────────────────────────────────────────────
    cruise_speed: 1.0                  # m/s during cruise segments
    approach_speed: 0.4                # m/s on the dock corridor (precision)
    creep_speed: 0.10                  # m/s for fine corrections / overshoot reverse. Halved from 0.18 so the chassis can stop within approach_tolerance instead of rolling several cm past on inertia + PID lag at the dock 'reached' threshold.
    calibration_speed: 0.5             # m/s during cold-start heading discovery (must exceed gps_node.heading_speed_threshold by margin)
    # Antenna offset auto-calibration STRAIGHT phase chord length. Drives
    # κ=0 for this distance, fits ψ_init from antenna ENU. 2 m gives a
    # chord well above the 1.5 m calibration_chord_min_m gate even when
    # the operator starts on slightly uneven ground.
    antenna_cal_straight_distance: 2.0

    # Antenna offset auto-cal drive speed. v = 0.5 m/s on R = 1.5 m keeps
    # lateral acceleration v²/R ≈ 0.17 m/s², low enough that wheel slip /
    # tyre scrub doesn't corrupt the encoder ω integration the closed-form
    # solver depends on (a 1.0 m / 0.8 m/s drive at 0.64 m/s² lat acc gave
    # 32% sweep mismatch between chassis encoder and antenna GPS — chassis
    # encoder under-counted rotation due to scrub).
    antenna_cal_speed: 0.5

    # Antenna offset auto-cal orbit shape. R = 1.5 m gives κ = 0.667 m⁻¹,
    # well inside the chassis curvature cap (1.2). Two revolutions at v =
    # 0.5 m/s = ~38 s, sampling ~380 GPS fixes (plenty for the closed-form
    # circle fits). Drive footprint ~ 3 m diameter + chassis ≈ 4 m × 4 m.
    antenna_cal_radius_m: 1.5
    antenna_cal_revolutions: 2
    # Rotation direction: +1 CCW (left turn), -1 CW. CCW first because that
    # was the SCURVE convention; flip if site geometry requires.
    antenna_cal_sign: 1

    # ── Path planner ────────────────────────────────────────────────────
    dock_approach_distance: 2.5        # meters of straight line before the dock pose. Lengthened from 1.5 so chassis has room to rotate into corridor heading inside the cruise leg before handing off to dock — critical when consecutive waypoints sit at 60°+ relative bearings (cruise from prev-dock-end with chassis ψ way off corridor; PP and Stanley both drift across the corridor before aligning, and the dock then opens at e_y ~30cm). 2.5m gives 4×min-turning-radius (0.56m) of room.

    # ── Cruise tracker (Stanley line follower) ──────────────────────────
    cruise_done_tolerance: 0.20        # meters from cruise end pose to declare cruise done and switch to dock
    cruise_done_heading_max_rad: 0.26  # ~15°. Done is only declared when chassis ψ is within this of psi_path AND inside cruise_done_tolerance, so the dock tracker takes over with a clean alignment instead of bake-in heading residual.
    cruise_pass_through_m: 0.30        # meters of past-end along-corridor overshoot that forces done regardless of heading. Safety net against PP-style orbit pathology re-emerging.
    cruise_k_lat: 4.0                  # Stanley arctan gain: desired_offset = atan2(k_lat·e_y, v). Drives the chassis toward the corridor as a function of lateral error. Higher = more aggressive lateral closure but more wari-gari risk under noise.
    cruise_k_heading: 3.0               # Proportional gain on the heading regulator: κ = -k_heading · e_psi_corrected. Raised 2.0→3.0 to close both final-approach precision gap and S-curve overshoot.
    cruise_stanley_offset_cap_rad: 0.262  # ~15°. Caps desired_offset so large lateral residuals don't drive the chassis perpendicular to the corridor. Tightened from 30° (commit d1a5997) to kill dock wari-gari.
    pp_min_speed_fraction: 0.25        # cos(e_psi_corrected) speed scale floor; lets tight cone-to-cone curves slow further before lateral correction blows out.
    pp_handoff_blend_distance: 1.0     # meters from cruise end at which commanded speed begins to taper from cruise_speed → approach_speed. Keyed on remaining cumulative distance to dock entry across all upcoming Reed-Shepp sub-segs, NOT per-sub-seg — without that, every 0.15-0.30 m Reed-Shepp sub-seg tripped this taper and capped commanded speed at ~0.5 m/s instead of cruise_speed=1.0 (16:47 trace: peak cmd v=0.61 m/s during what should have been full-cruise stretches).
    cruise_dock_lateral_max: 0.10      # meters — |e_y| above this at the cruise→dock handoff triggers a replan from the live chassis pose, instead of opening the dock tracker with a residual too large to close smoothly. 0.10 m fits inside the 2.5 m dock corridor at v=0.4 m/s under Stanley k_lat=4 cap 15° (closes 0.4·sin(15°)·5 s = 0.52 m of lateral budget).
    cruise_zero_cross_speed_threshold: 0.10  # m/s — cruise tracker's zero-cross gate holds v=0 between Reed-Shepp sub-segs of opposite direction until measured chassis speed drops below this. Above the 0.05 m/s MCU PID deadband so it releases on genuine standstill, not encoder noise. Without the gate, the 16:47 WP2 case sent cmd v=-0.68 while chassis was still rolling forward at +0.5 m/s under accel_limit=0.8 m/s² ramping; chassis drifted 0.65 m past planned dock entry before MCU caught up.

    # ── Dock tracker (state-feedback line follower) ─────────────────────
    dock_k_y: 6.0                      # 1/m — legacy P-gain on antenna lateral error, retained for backward compat. The Stanley refinement uses dock_stanley_k_lat instead; dock_k_y is only consulted as the upper-bound fallback when dock_stanley_k_lat is absent.
    dock_stanley_k_lat: 4.0            # Stanley arctan gain for the dock tracker: desired_offset = atan2(k·e_y, v). Matched to cruise_k_lat so cruise→dock handoff doesn't change closure dynamics. 2.5→4.0 closes the final cm under real steering instead of inertia.
    dock_k_psi: 5.0                    # 1/m — gain on chassis heading error vs path. ζ = k_ψ / (2·√k_y) ≈ 1.02 (near-critical) at k_y=6.
    dock_k_i: 0.4                      # 1/(m·s) — integral on antenna lateral error. Cancels constant κ-bias from antenna-offset residual / mast tilt / slope.
    dock_integral_limit: 0.5           # m·s — clamp on the integral state. Also acts as the anti-windup mechanism: during sustained κ-saturation the integral pumps up to ±limit and stops, bounding the kappa contribution k_i × limit regardless of how long saturation persists.
    dock_stanley_offset_cap_rad: 0.262 # ~15°. Matches cruise_stanley_offset_cap_rad so the cruise→dock handoff doesn't switch to a wider cap and start cross-and-swinging at the dock entry.
    dock_reverse_recovery_m: 0.08      # meters behind the target (along corridor) to back up to before re-engaging forward control after an along-track overshoot. Tight cycle (4 cm back, 4 cm forward) prevents 20 cm slingshot.
    dock_brake_zone_m: 0.06            # meters under which forward speed ramps down approaching target. Wider zone bleeds inertia + PID lag before the antenna crosses the target.
    dock_brake_min_speed_frac: 0.70    # minimum fraction of creep_speed inside brake_zone. 0.70 × 0.10 = 0.07 m/s stays above MCU PID deadband 0.05 m/s so the chassis crosses the last cm under power.
    dock_reverse_stall_timeout_s: 5.0  # seconds in reverse before checking displacement. If chassis rotates in place under saturated latched κ instead of backing up, the watchdog bails to navigator for replan.
    dock_reverse_stall_min_disp_m: 0.30  # minimum chassis displacement (m) during a reverse stroke before stall is declared. 0.30 m = 6 cm/s average over 5 s, well below the 0.10 m/s commanded creep — anything less means the chassis isn't translating.
    approach_tolerance: 0.03           # antenna-to-target distance to declare dock reached. Matched to settle_tolerance — the new dock logic stops on raw distance (no along-track gate), so this directly bounds final landing.
    creep_zone: 0.40                   # meters from target to drop from approach_speed to creep_speed

    # ── Tolerances and timeouts ─────────────────────────────────────────
    waypoint_tolerance: 0.05           # meters antenna-to-target to consider waypoint hit
    settle_tolerance: 0.03             # meters for tight settle confirmation
    settle_readings: 8                 # consecutive in-tolerance readings to declare settled (was 5; 8 × 50 ms = 400 ms washes out chassis decel + mast ringing)
    settle_timeout: 12.0               # seconds. Reverse-with-steering closes lateral on both halves of the round trip (~62 %/cycle at k_y=6), so a single 5 s cycle clears 5 cm residual to under 2 cm, and 12 s leaves slack for the cruise→dock handoff transient.
    active_settle_throttle_s: 1.5      # seconds — minimum interval between active-settle retries when dock drifts back outside waypoint_tolerance. Stops the navigator from cycling SETTLING→NAVIGATING in 50 ms ticks on a dock that declares 'reached' immediately on re-engagement.
    spray_timeout: 5.0                 # seconds to wait for spray_done before auto-skip
    stuck_timeout: 12.0                # seconds without progress before retry/skip
    stuck_max_retries: 2

    # ── Calibration quality gates ───────────────────────────────────────
    calibration_distance: 2.5          # meters of straight drive
    calibration_max_distance: 5.0      # meters cap — ERROR if heading still untrustworthy
    calibration_min_samples: 20        # ≥1 second at 20 Hz
    calibration_chord_min_m: 1.5       # require this chord length for trustworthy heading fit
    calibration_residual_max: 0.05     # meters RMS of perpendicular residuals (~2° heading 1σ at 1.5 m chord)

    # ── Wheel scale auto-calibration (CAL_WHEELS state) ─────────────────
    wheel_cal_distance: 10.0           # meters of straight drive to converge on (GPS chord)
    wheel_cal_speed: 0.5               # m/s during the calibration drive
    wheel_cal_max_distance: 15.0       # cap — give up if 15 m elapsed without resolving

    # ── State estimator ─────────────────────────────────────────────────
    estimator_pos_gain: 0.30           # blend factor for GPS antenna position correction
    estimator_psi_gain: 0.30           # blend factor for GPS heading-of-motion correction. Doubled 0.15→0.30: at 10 Hz heading updates the previous gain gave τ ≈ 0.67 s of lag in chassis_psi, which combined with cruise Stanley's k_heading=3 (loop gain v·k_heading = 1.5 rad/s) sat exactly at the phase margin where the 17:18 trace showed kappa winding up against a slow-to-update heading reading. Raising to 0.30 halves τ to ~0.33 s — phase margin jumps ~30°, oscillation in the loop dies. Tradeoff: heading correction is twice as sensitive to GPS heading-of-motion noise (RTK 1σ ≈ 1°), so the chassis_psi reading carries ~±1.4° noise band instead of ±1°. Stanley k_heading=3 turns that into ±0.07 rad/m kappa noise — negligible compared to the loop-instability artefacts it cures.
    estimator_psi_min_speed: 0.4       # m/s below which heading-of-motion is too noisy to trust

    # ── Safety ──────────────────────────────────────────────────────────
    gps_timeout: 3.0                   # seconds without GPS before ERROR
    fix_hysteresis_s: 0.8              # seconds of bad fix tolerated before ERROR
    required_fix_status: "rtk_fixed"
    # When the live fix is rtk_float (integer ambiguity unresolved), accept
    # it if reported horizontal accuracy is at or below this many mm.
    # 0 disables — falls back to fixed-only behaviour. 20 mm matches the
    # waypoint cm-tolerance budget; anything sloppier and the mission
    # errors out instead of plotting onto a potentially-drifted estimate.
    fix_accept_float_max_h_acc_mm: 20
    return_to_start: true

    # Battery state-of-charge gates (the MCU has its own hard cutoff at
    # BATTERY_UNDERVOLT_V=20 V; these stop the navigator earlier so motors
    # don't cut out mid-dock).
    battery_warn_pct: 20               # below this, refuse to start a new mission
    battery_abort_pct: 10              # below this, abort an active mission and ERROR

spray_node:
  ros__parameters:
    servo_pin: 13                      # Spray servo GPIO pin (HW PWM channel 1)
    spray_angle: 90                    # Servo angle for spray position (degrees)
    rest_angle: 0                      # Servo angle for rest position (degrees)
    spray_duration: 0.5                # Seconds to hold spray position
    retract_delay: 0.3                 # Seconds to wait after retract before done
    gpio_chip: 4                       # GPIO chip number (RPi5 RP1 = 4)

mcu_bridge_node:
  ros__parameters:
    # USB CDC link to the RP2040 coprocessor (course/rover/mcu/).
    serial_port: "/dev/ttyMCU"         # udev symlink (see scripts/99-fsk-rover.rules)
    baud_rate: 115200                  # USB CDC ignores this but pyserial requires it
    heartbeat_hz: 10.0                 # MCU Pi-link WDT = 500 ms
    reconnect_delay_s: 2.0
    # Ackermann + steering servo
    servo_center_us: 1500
    servo_range_us: 500
    max_steering_angle_deg: 30.5
    wheelbase: 0.33                    # tape-measured 2026-05-08
    track_width: 0.33                  # tape-measured 2026-05-08
    # Operator-measured open-loop top speed at 100% duty is ~2.3 m/s on
    # this drivetrain at full LiFePO4. Cap was previously 1.5, which forced
    # PID setpoint at full manual throttle to 1.5 (since target_speed =
    # throttle_pct/100 × max_speed). Raised to 2.5 so PID can issue the
    # full-duty setpoint manual control expects.
    max_speed: 2.5
    # accel_limit applies to chassis longitudinal speed (m/s²), NOT to
    # per-wheel duty as the previous implementation did. Ramping per duty
    # killed the Ackermann differential during the first ~1.5s of every
    # turn — the rover scrubbed instead of arcing cleanly. Now the
    # steering servo applies κ instantly and only v ramps.
    accel_limit: 0.8
    manual_priority_s: 1.0
    # PID closed loop on the MCU. ON.
    # Gains tuned on the bench (jacked-up, step responses across
    # 0.3-1.2 m/s targets). With kp=1.0, ki=3.0:
    #   * steady-state error ~ -3 % (consistent across speed range)
    #   * overshoot < 2 % even on hardest step
    #   * rise time 0.1-0.5 s
    # kp ≥ 4 produced strong oscillation (Ku ≈ 3-4, picked 0.45·Ku);
    # kd left at 0 because derivative-on-measurement on a noisy
    # encoder amplifies more noise than it dampens for a system this
    # small. Drive-only sign clamp + 0.05 m/s deadband in the MCU
    # firmware handle the stop-on-zero behaviour so PID never
    # reverse-PWMs the wheels.
    use_pid: true
    pid_kp: 1.0
    pid_ki: 3.0
    pid_kd: 0.0
