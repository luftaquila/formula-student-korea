bridge_node:
  ros__parameters:
    server_url: ""                     # Course server URL (e.g., https://test.luftaquila.io/course). MUST be https.
    # internal_secret is injected via INTERNAL_SECRET env var; never commit.
    # server_url_allow_http defaults to false. Only set true on trusted internal (e.g. Tailscale) networks.
    server_url_allow_http: false
    position_report_interval: 1.0      # Seconds between position reports (always, even when idle)
    sse_reconnect_delay: 3.0           # Initial SSE reconnect delay (exponential backoff)

gps_node:
  ros__parameters:
    serial_port: "/dev/ttyGPS"         # udev symlink (see host/files/usr/lib/udev/rules.d/99-fsk-rover.rules)
    baud_rate: 115200
    publish_rate: 10.0                 # Hz
    heading_speed_threshold: 0.3       # m/s minimum to publish heading
    # NOTE: the NTRIP username MUST be injected via the NTRIP_USERNAME env
    # var (sourced from a podman secret in the rover image), never committed
    # to this file. Leave blank here so the repo stays safe to publish.
    ntrip:
      # Caster host/port/password are hard-coded constants in gps_node.py
      # because the rover only ever targets NGII (www.gnssdata.or.kr:2101)
      # whose shared RTK login uses the fixed password "gnss". Only the
      # per-operator username is configurable, and mountpoint is auto-
      # selected at runtime by nearest-base-station lookup against the
      # caster's source table.
      username: ""
      gga_interval_s: 10.0             # Seconds between GGA heartbeats to the caster

navigator_node:
  ros__parameters:
    waypoint_tolerance: 0.05           # Meters to consider waypoint reached (5cm)
    approach_tolerance: 0.30           # Meters to switch to precision approach
    calibration_distance: 2.5          # Meters to drive for heading calibration
    calibration_max_distance: 5.0      # Meters cap — enter ERROR if variance still high here
    calibration_speed: 0.5             # m/s during calibration. Must exceed gps_node.heading_speed_threshold (0.3) with margin so heading actually publishes.
    cruise_speed: 1.2                  # m/s during normal navigation
    approach_speed: 0.2                # m/s during precision approach
    lookahead_min: 0.8                 # Minimum Pure Pursuit lookahead (meters). Set ≥ minimum turn radius (wheelbase/tan(max_steering) ≈ 0.81 m) so PP never demands a tighter arc than physically possible.
    lookahead_gain: 0.5                # Lookahead = gain * speed
    max_curvature: 1.2                 # 1/m cap on Pure Pursuit curvature. Physical limit is tan(25°)/0.38 ≈ 1.23; set just below for headroom.
    heading_calibrated_threshold: 5.0  # Degrees, max variance for calibrated heading
    gps_timeout: 3.0                   # Seconds without GPS before ERROR state
    fix_hysteresis_s: 0.8              # Seconds of bad fix tolerated before ERROR (avoids 50ms flicker)
    return_to_start: true              # Return to starting position after last waypoint
    stuck_timeout: 10.0                # Seconds without progress before retry/skip
    stuck_max_retries: 2               # Max retries before skipping waypoint
    spray_timeout: 5.0                 # Seconds to wait for spray_done before auto-skip
    creep_speed: 0.15                  # m/s during position correction creep. Must stay above the motors' static-friction breakaway (≈3% duty stalled the rover in field testing).
    decel_distance: 2.0                # Meters from waypoint to start decelerating
    settle_readings: 5                 # Consecutive GPS readings to confirm settled position
    settle_tolerance: 0.03             # Meters for tight settle confirmation (3cm)
    settle_timeout: 10.0               # Seconds before settling gives up and sprays anyway
    required_fix_status: "rtk_fixed"   # Minimum GPS fix quality required to start/resume mission

spray_node:
  ros__parameters:
    servo_pin: 13                      # Spray servo GPIO pin (HW PWM channel 1)
    spray_angle: 90                    # Servo angle for spray position (degrees)
    rest_angle: 0                      # Servo angle for rest position (degrees)
    spray_duration: 0.5                # Seconds to hold spray position
    retract_delay: 0.3                 # Seconds to wait after retract before done
    gpio_chip: 4                       # GPIO chip number (RPi5 RP1 = 4)

mcu_bridge_node:
  ros__parameters:
    # USB CDC link to the RP2040 coprocessor (course/rover/mcu/).
    serial_port: "/dev/ttyMCU"         # udev symlink (see scripts/99-fsk-rover.rules)
    baud_rate: 115200                  # USB CDC ignores this but pyserial requires it
    heartbeat_hz: 10.0                 # MCU Pi-link WDT = 500 ms
    reconnect_delay_s: 2.0
    # Ackermann + steering servo
    servo_center_us: 1500
    servo_range_us: 500
    max_steering_angle: 25.0
    wheelbase: 0.38
    track_width: 0.30
    max_speed: 1.5
    accel_limit: 0.5
    manual_priority_s: 1.0
    # dt used by accel_limit. _drive() runs once per /rover/cmd/velocity,
    # which navigator publishes at 20 Hz (50 ms). Set to match.
    command_period_s: 0.05
    # PID closed loop on the MCU. Off until encoders are calibrated and
    # gains are tuned on the actual hardware.
    use_pid: false
    pid_kp: 0.6
    pid_ki: 1.5
    pid_kd: 0.0
