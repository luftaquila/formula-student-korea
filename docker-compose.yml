services:
  entry:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: entry
        PORT: 9100
    container_name: fsk-entry
    environment:
      - AUTH_SERVER=http://auth:9800
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    volumes:
      - ./entry/data:/home/node/fsk-entry/data
    depends_on:
      - auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - fsk-network

  traffic:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: traffic
        PORT: 9200
    container_name: fsk-traffic
    environment:
      - AUTH_SERVER=http://auth:9800
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    volumes:
      - ./traffic/data:/home/node/fsk-traffic/data
    depends_on:
      - auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9200/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - fsk-network

  energymeter:
    build:
      context: ./energymeter
      dockerfile: Dockerfile
    container_name: fsk-energymeter
    restart: unless-stopped
    networks:
      - fsk-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: queue
        PORT: 9300
    container_name: fsk-queue
    environment:
      - ENTRY_SERVER=http://entry:9100
      - AUTH_SERVER=http://auth:9800
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - NAVER_CLOUD_ACCESS_KEY=${NAVER_CLOUD_ACCESS_KEY}
      - NAVER_CLOUD_SECRET_KEY=${NAVER_CLOUD_SECRET_KEY}
      - NAVER_CLOUD_SMS_SERVICE_ID=${NAVER_CLOUD_SMS_SERVICE_ID}
      - PHONE_NUMBER_SMS_SENDER=${PHONE_NUMBER_SMS_SENDER}
    volumes:
      - ./queue/data:/home/node/fsk-queue/data
    depends_on:
      - entry
      - auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9300/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - fsk-network

  inspection:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: inspection
        PORT: 9600
    container_name: fsk-inspection
    environment:
      - AUTH_SERVER=http://auth:9800
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    volumes:
      - ./inspection/data:/home/node/fsk-inspection/data
    depends_on:
      - auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9600/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - fsk-network

  score:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: score
        PORT: 9700
    container_name: fsk-score
    environment:
      - ENTRY_SERVER=http://entry:9100
      - INSPECTION_SERVER=http://inspection:9600
      - TRAFFIC_SERVER=http://traffic:9200
      - AUTH_SERVER=http://auth:9800
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    volumes:
      - ./score/data:/home/node/fsk-score/data
    depends_on:
      - entry
      - inspection
      - traffic
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9700/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - fsk-network

  documents:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: documents
        PORT: 9900
    container_name: fsk-documents
    environment:
      - AUTH_SERVER=http://auth:9800
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    volumes:
      - ./documents/data:/home/node/fsk-documents/data
    depends_on:
      - auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9900/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - fsk-network

  auth:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: auth
        PORT: 9800
    container_name: fsk-auth
    environment:
      - LOG_SERVICES=entry:http://entry:9100,queue:http://queue:9300,inspection:http://inspection:9600,traffic:http://traffic:9200,score:http://score:9700,documents:http://documents:9900
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./auth/data:/home/node/fsk-auth/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9800/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - fsk-network

  rules:
    image: caddy:alpine
    container_name: fsk-rules
    volumes:
      - ./rules/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./rules/template.html:/etc/caddy/template.html:ro
      - ./rules/data:/srv/rules
      - ./rules/README.md:/srv/rules/README.md:ro
    restart: unless-stopped
    networks:
      - fsk-network

  # Production (default) - use traefik reverse proxy
  caddy:
    build: &caddy-build
      context: .
      dockerfile: landing/Dockerfile
    container_name: fsk-caddy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fsk.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.fsk.entrypoints=websecure"
      - "traefik.http.routers.fsk.tls=true"
      - "traefik.http.routers.fsk.tls.certresolver=le"
      - "traefik.http.services.fsk.loadbalancer.server.port=9000"
    depends_on: &caddy-depends
      - entry
      - traffic
      - energymeter
      - queue
      - inspection
      - score
      - documents
      - rules
      - auth
    restart: unless-stopped
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    networks:
      - fsk-network
      - traefik

  # Local development - expose port 9000
  caddy-local:
    build: *caddy-build
    container_name: fsk-caddy-local
    profiles:
      - local
    ports:
      - "127.0.0.1:9000:9000"
    depends_on: *caddy-depends
    restart: unless-stopped
    networks:
      - fsk-network

networks:
  fsk-network:
    driver: bridge
  traefik:
    external: true
