services:
  entry:
    build:
      context: .
      dockerfile: entry/Dockerfile
    container_name: fsk-entry
    volumes:
      - ./entry/data:/home/node/fsk-entry/data
    restart: unless-stopped
    networks:
      - fsk-network

  traffic:
    build:
      context: .
      dockerfile: traffic/Dockerfile
    container_name: fsk-traffic
    environment:
      - ENTRY_SERVER=http://entry:9100
    volumes:
      - ./traffic/data:/home/node/fsk-traffic/data
    depends_on:
      - entry
    restart: unless-stopped
    networks:
      - fsk-network

  energymeter:
    build:
      context: ./energymeter
      dockerfile: Dockerfile
    container_name: fsk-energymeter
    restart: unless-stopped
    networks:
      - fsk-network

  scoreboard:
    build:
      context: .
      dockerfile: scoreboard/Dockerfile
    container_name: fsk-scoreboard
    restart: unless-stopped
    networks:
      - fsk-network

  queue:
    build:
      context: .
      dockerfile: queue/Dockerfile
    container_name: fsk-queue
    env_file:
      - .env
    environment:
      - ENTRY_SERVER=http://entry:9100
    volumes:
      - ./queue/data:/home/node/fsk-queue/data
    depends_on:
      - entry
    restart: unless-stopped
    networks:
      - fsk-network

  rules:
    image: caddy:alpine
    container_name: fsk-rules
    volumes:
      - ./rules/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./rules/data:/srv/rules:ro
    restart: unless-stopped
    networks:
      - fsk-network

  # Production (default) - use traefik reverse proxy
  nginx:
    build: &nginx-build
      context: .
      dockerfile: landing/Dockerfile
    container_name: fsk-nginx
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fsk.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.fsk.entrypoints=websecure"
      - "traefik.http.routers.fsk.tls=true"
      - "traefik.http.routers.fsk.tls.certresolver=le"
      - "traefik.http.services.fsk.loadbalancer.server.port=9000"
    volumes: &nginx-volumes
      - ./.htpasswd.admin:/etc/nginx/.htpasswd.admin:ro
      - ./.htpasswd.official:/etc/nginx/.htpasswd.official:ro
    depends_on: &nginx-depends
      - entry
      - traffic
      - energymeter
      - scoreboard
      - queue
      - rules
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - fsk-network
      - traefik

  # Local development - expose port 9000
  nginx-local:
    build: *nginx-build
    container_name: fsk-nginx-local
    profiles:
      - local
    ports:
      - "9000:9000"
    volumes: *nginx-volumes
    depends_on: *nginx-depends
    restart: unless-stopped
    networks:
      - fsk-network

networks:
  fsk-network:
    driver: bridge
  traefik:
    external: true
