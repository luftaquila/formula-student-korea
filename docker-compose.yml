services:
  entry:
    build:
      context: .
      dockerfile: entry/Dockerfile
    container_name: fsk-entry
    volumes:
      - ./entry/data:/home/node/fsk-entry/data
    restart: unless-stopped
    networks:
      - fsk-network

  traffic:
    build:
      context: .
      dockerfile: traffic/Dockerfile
    container_name: fsk-traffic
    environment:
      - ENTRY_SERVER=http://entry:9100
    volumes:
      - ./traffic/data:/home/node/fsk-traffic/data
    depends_on:
      - entry
    restart: unless-stopped
    networks:
      - fsk-network

  energymeter:
    build:
      context: ./energymeter
      dockerfile: Dockerfile
    container_name: fsk-energymeter
    restart: unless-stopped
    networks:
      - fsk-network

  queue:
    build:
      context: .
      dockerfile: queue/Dockerfile
    container_name: fsk-queue
    env_file:
      - .env
    environment:
      - ENTRY_SERVER=http://entry:9100
    volumes:
      - ./queue/data:/home/node/fsk-queue/data
    depends_on:
      - entry
    restart: unless-stopped
    networks:
      - fsk-network

  nginx:
    build:
      context: .
      dockerfile: landing/Dockerfile
    container_name: fsk-nginx
    ports:
      - "9000:9000"
    volumes:
      - ./.htpasswd.admin:/etc/nginx/.htpasswd.admin:ro
      - ./.htpasswd.official:/etc/nginx/.htpasswd.official:ro
    depends_on:
      - entry
      - traffic
      - energymeter
      - queue
    restart: unless-stopped
    networks:
      - fsk-network

networks:
  fsk-network:
    driver: bridge
