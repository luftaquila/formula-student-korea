x-common-env: &common-env
  JWT_SECRET: ${JWT_SECRET}
  INTERNAL_SECRET: ${INTERNAL_SECRET}

x-common-healthcheck: &common-healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  entry:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: entry
        PORT: 9100
    container_name: fsk-entry
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      AUTH_SERVER: http://auth:9800
    volumes:
      - ./entry/data:/home/node/fsk-entry/data
    depends_on:
      auth:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  traffic:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: traffic
        PORT: 9200
    container_name: fsk-traffic
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      AUTH_SERVER: http://auth:9800
    volumes:
      - ./traffic/data:/home/node/fsk-traffic/data
    depends_on:
      auth:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9200/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  energymeter:
    build:
      context: ./energymeter
      dockerfile: Dockerfile
    container_name: fsk-energymeter
    security_opt:
      - label:disable
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - fsk-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: queue
        PORT: 9300
    container_name: fsk-queue
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      ENTRY_SERVER: http://entry:9100
      AUTH_SERVER: http://auth:9800
      NAVER_CLOUD_ACCESS_KEY: ${NAVER_CLOUD_ACCESS_KEY}
      NAVER_CLOUD_SECRET_KEY: ${NAVER_CLOUD_SECRET_KEY}
      NAVER_CLOUD_SMS_SERVICE_ID: ${NAVER_CLOUD_SMS_SERVICE_ID}
      PHONE_NUMBER_SMS_SENDER: ${PHONE_NUMBER_SMS_SENDER}
    volumes:
      - ./queue/data:/home/node/fsk-queue/data
    depends_on:
      entry:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9300/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  inspection:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: inspection
        PORT: 9600
    container_name: fsk-inspection
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      AUTH_SERVER: http://auth:9800
    volumes:
      - ./inspection/data:/home/node/fsk-inspection/data
    depends_on:
      auth:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9600/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  score:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: score
        PORT: 9700
    container_name: fsk-score
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      ENTRY_SERVER: http://entry:9100
      INSPECTION_SERVER: http://inspection:9600
      TRAFFIC_SERVER: http://traffic:9200
      AUTH_SERVER: http://auth:9800
    volumes:
      - ./score/data:/home/node/fsk-score/data
    depends_on:
      entry:
        condition: service_healthy
      inspection:
        condition: service_healthy
      traffic:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9700/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  documents:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: documents
        PORT: 9900
    container_name: fsk-documents
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      AUTH_SERVER: http://auth:9800
    volumes:
      - ./documents/data:/home/node/fsk-documents/data
    depends_on:
      auth:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9900/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  auth:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: auth
        PORT: 9800
    container_name: fsk-auth
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      LOG_SERVICES: "entry:http://entry:9100,queue:http://queue:9300,inspection:http://inspection:9600,traffic:http://traffic:9200,score:http://score:9700,documents:http://documents:9900"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
    volumes:
      - ./auth/data:/home/node/fsk-auth/data
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9800/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  rules:
    image: docker.io/library/caddy:alpine
    container_name: fsk-rules
    security_opt:
      - label:disable
    volumes:
      - ./rules/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./rules/template.html:/etc/caddy/template.html:ro
      - ./rules/data:/srv/rules
      - ./rules/README.md:/srv/rules/README.md:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - fsk-network

  # Production - use traefik reverse proxy
  caddy:
    build: &caddy-build
      context: .
      dockerfile: landing/Dockerfile
    container_name: fsk-caddy
    security_opt:
      - label:disable
    profiles:
      - production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fsk.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.fsk.entrypoints=websecure"
      - "traefik.http.routers.fsk.tls=true"
      - "traefik.http.routers.fsk.tls.certresolver=le"
      - "traefik.http.services.fsk.loadbalancer.server.port=9000"
    depends_on: &caddy-depends
      - entry
      - traffic
      - energymeter
      - queue
      - inspection
      - score
      - documents
      - rules
      - auth
    restart: unless-stopped
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - fsk-network
      - traefik

  # Local development - expose port 9000
  caddy-local:
    build: *caddy-build
    container_name: fsk-caddy-local
    profiles:
      - local
    ports:
      - "0.0.0.0:9000:9000"
    depends_on: *caddy-depends
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - fsk-network

networks:
  fsk-network:
    driver: bridge
  traefik:
    external: true
