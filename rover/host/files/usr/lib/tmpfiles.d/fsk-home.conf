# Seed /var/home/fsk on first boot. systemd-tmpfiles silently ignores
# additional lines that target the same path (treated as a duplicate
# rather than a merge), so each directive must address a distinct
# path: 'd' for the home dir and the .ssh subdir, 'C' for the
# authorized_keys file. The 'C' source defaults to
# /usr/share/factory/var/home/fsk/.ssh/authorized_keys, baked by the
# host Containerfile.
#
# /var/home/<user>/.ssh/* picks up ssh_home_t from the targeted
# SELinux file_contexts policy as it's created, so we don't need a
# separate restorecon step.
d /var/home/fsk                       0700 fsk fsk - -
d /var/home/fsk/.ssh                  0700 fsk fsk - -
C /var/home/fsk/.ssh/authorized_keys  0600 fsk fsk - -
