# Declare the fsk operator user. systemd-sysusers runs at every boot and
# adds missing entries to /etc/passwd / /etc/group / /etc/shadow without
# touching what's already there. Using sysusers.d (instead of editing
# /etc/passwd at image build time) is the only reliable way to add a
# user in a bootc image — OSTree's three-way merge for /etc would
# otherwise drop our new /etc/passwd entries whenever the previous
# deployment had any user modifications.
#
# UID 1500: the AlmaLinux SD base ships a cloud-init that creates user
# 'almalinux' at UID 1000. Even with users: [] in user-data the default
# user can still be applied, and sysusers won't add fsk if 1000 is
# taken. 1500 sidesteps the conflict entirely.
u fsk 1500 - /home/fsk /bin/bash
