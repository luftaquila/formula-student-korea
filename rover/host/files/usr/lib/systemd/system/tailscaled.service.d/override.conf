[Unit]
# Start tailscaled only after the clock is synchronised (chrony-wait.service ->
# time-sync.target). The Pi 5 RTC has no backup cell, so a cold boot starts with
# a wrong clock; without this, tailscaled's control-server TLS fails ("cert not
# yet valid") and it can't recover (its only resolv.conf entry is MagicDNS, which
# is also down while tailscale is down). chrony syncs via the pinned NTP IPs
# (DNS-free, see chrony.conf) within seconds, so tailscaled then starts with a
# correct clock and connects on the first try — no restart, no persisted clock.
After=time-sync.target
Wants=time-sync.target
