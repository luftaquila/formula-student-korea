events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 9000;
        server_name localhost;

        # Landing page static assets
        location ~ ^/(assets|favicon\.ico) {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        # Landing page
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # Entry API (public - needed by queue service)
        location /entry/api {
            rewrite ^/entry/api(.*)$ /api$1 break;
            proxy_pass http://entry:9100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Entry service static assets (protected)
        location ~ ^/entry/(assets|favicon\.ico) {
            auth_basic "FSK Officials";
            auth_basic_user_file /etc/nginx/.htpasswd;
            
            rewrite ^/entry/(.*)$ /$1 break;
            proxy_pass http://entry:9100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Entry service (protected)
        location /entry {
            auth_basic "FSK Officials";
            auth_basic_user_file /etc/nginx/.htpasswd;
            
            rewrite ^/entry/?(.*)$ /$1 break;
            proxy_pass http://entry:9100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /entry;
        }

        # Traffic API (protected)
        location /traffic/api {
            auth_basic "FSK Officials";
            auth_basic_user_file /etc/nginx/.htpasswd;
            
            rewrite ^/traffic/api(.*)$ /api$1 break;
            proxy_pass http://traffic:9200;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Traffic service static assets (protected)
        location ~ ^/traffic/(assets|favicon\.ico) {
            auth_basic "FSK Officials";
            auth_basic_user_file /etc/nginx/.htpasswd;
            
            rewrite ^/traffic/(.*)$ /$1 break;
            proxy_pass http://traffic:9200;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Traffic service (protected)
        location /traffic {
            auth_basic "FSK Officials";
            auth_basic_user_file /etc/nginx/.htpasswd;
            
            rewrite ^/traffic/?(.*)$ /$1 break;
            proxy_pass http://traffic:9200;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /traffic;
        }

        # Queue admin routes (protected) - must come before general /queue
        location ~ ^/queue/(admin|register|priority) {
            auth_basic "FSK Officials";
            auth_basic_user_file /etc/nginx/.htpasswd;
            
            rewrite ^/queue/?(.*)$ /$1 break;
            proxy_pass http://queue:9300;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /queue;
        }

        # Queue API (public)
        location /queue/api {
            rewrite ^/queue/api(.*)$ /api$1 break;
            proxy_pass http://queue:9300;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Queue service static assets (public)
        location ~ ^/queue/(assets|favicon\.ico) {
            rewrite ^/queue/(.*)$ /$1 break;
            proxy_pass http://queue:9300;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Queue service (public)
        location /queue {
            rewrite ^/queue/?(.*)$ /$1 break;
            proxy_pass http://queue:9300;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /queue;
        }

        # Energymeter service static assets (public)
        location ~ ^/energymeter/(assets|favicon\.ico|lib) {
            rewrite ^/energymeter/(.*)$ /$1 break;
            proxy_pass http://energymeter:9400;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Energymeter service (public)
        location /energymeter {
            rewrite ^/energymeter/?(.*)$ /$1 break;
            proxy_pass http://energymeter:9400;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /energymeter;
        }
    }
}
