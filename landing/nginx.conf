events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 9000;
        server_name localhost;

        # Global favicon for all services
        location = /favicon.ico {
            root /usr/share/nginx/html;
            try_files /favicon.ico =404;
        }

        # Landing page static assets
        location ~ ^/(assets|bypass\.js) {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        # Landing page
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # Rules file server (Caddy)
        location /rules {
            proxy_pass http://rules:9500;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Entry API (public - needed by queue service)
        location /entry/api {
            rewrite ^/entry/api(.*)$ /api$1 break;
            proxy_pass http://entry:9100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Entry service static assets (protected - admin only)
        location ~ ^/entry/assets {
            auth_basic "FSK Admin";
            auth_basic_user_file /etc/nginx/.htpasswd.admin;

            rewrite ^/entry/(.*)$ /$1 break;
            proxy_pass http://entry:9100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Entry service (protected - admin only)
        location /entry {
            auth_basic "FSK Admin";
            auth_basic_user_file /etc/nginx/.htpasswd.admin;

            rewrite ^/entry/?(.*)$ /$1 break;
            proxy_pass http://entry:9100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /entry;
        }

        # Traffic API - SSE events (protected - officials for scoreboard)
        location /traffic/api/events {
            auth_basic "FSK Officials";
            auth_basic_user_file /etc/nginx/.htpasswd.official;

            rewrite ^/traffic/api(.*)$ /api$1 break;
            proxy_pass http://traffic:9200;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE specific settings
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
        }

        # Traffic API - records (protected - officials for scoreboard)
        location ~ ^/traffic/api/records/(.+)$ {
            auth_basic "FSK Officials";
            auth_basic_user_file /etc/nginx/.htpasswd.official;

            rewrite ^/traffic/api(.*)$ /api$1 break;
            proxy_pass http://traffic:9200;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Traffic API (protected - admin only)
        location /traffic/api {
            auth_basic "FSK Admin";
            auth_basic_user_file /etc/nginx/.htpasswd.admin;

            rewrite ^/traffic/api(.*)$ /api$1 break;
            proxy_pass http://traffic:9200;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Traffic service static assets (protected - admin only)
        location ~ ^/traffic/assets {
            auth_basic "FSK Admin";
            auth_basic_user_file /etc/nginx/.htpasswd.admin;

            rewrite ^/traffic/(.*)$ /$1 break;
            proxy_pass http://traffic:9200;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Traffic service (protected - admin only)
        location /traffic {
            auth_basic "FSK Admin";
            auth_basic_user_file /etc/nginx/.htpasswd.admin;

            rewrite ^/traffic/?(.*)$ /$1 break;
            proxy_pass http://traffic:9200;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /traffic;
        }

        # Queue admin routes (protected) - must come before general /queue
        location ~ ^/queue/(admin|register|priority) {
            auth_basic "FSK Officials";
            auth_basic_user_file /etc/nginx/.htpasswd.official;

            rewrite ^/queue/?(.*)$ /$1 break;
            proxy_pass http://queue:9300;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /queue;
        }

        # Queue API (public)
        location /queue/api {
            rewrite ^/queue/api(.*)$ /api$1 break;
            proxy_pass http://queue:9300;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Queue service static assets (public)
        location ~ ^/queue/assets {
            rewrite ^/queue/(.*)$ /$1 break;
            proxy_pass http://queue:9300;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Queue service (public)
        location /queue {
            rewrite ^/queue/?(.*)$ /$1 break;
            proxy_pass http://queue:9300;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /queue;
        }

        # Energymeter service static assets (public)
        location ~ ^/energymeter/(assets|lib) {
            rewrite ^/energymeter/(.*)$ /$1 break;
            proxy_pass http://energymeter:9400;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Energymeter service (public)
        location /energymeter {
            rewrite ^/energymeter/?(.*)$ /$1 break;
            proxy_pass http://energymeter:9400;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /energymeter;
        }

        # Scoreboard service static assets (protected - officials)
        location ~ ^/scoreboard/assets {
            auth_basic "FSK Officials";
            auth_basic_user_file /etc/nginx/.htpasswd.official;

            rewrite ^/scoreboard/(.*)$ /$1 break;
            proxy_pass http://scoreboard:9500;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Scoreboard service (protected - officials)
        location /scoreboard {
            auth_basic "FSK Officials";
            auth_basic_user_file /etc/nginx/.htpasswd.official;

            rewrite ^/scoreboard/?(.*)$ /$1 break;
            proxy_pass http://scoreboard:9500;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /scoreboard;
        }
    }
}
