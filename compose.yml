x-common-env: &common-env
  JWT_SECRET: ${JWT_SECRET}
  INTERNAL_SECRET: ${INTERNAL_SECRET}
  TEST_SERVER: ${TEST_SERVER:-}

x-common-healthcheck: &common-healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 5s

services:
  competition:
    image: ghcr.io/luftaquila/formula-student-korea/competition:latest
    build:
      context: .
      dockerfile: competition/Dockerfile
    container_name: fsk-competition
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      PUBLIC_URL: ${PUBLIC_URL}
    volumes:
      - ./competition/data:/app/data
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9200/health/ready"]
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - fsk-network

  course:
    image: ghcr.io/luftaquila/formula-student-korea/course:latest
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: course
        PORT: 10000
    container_name: fsk-course
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      MISSION_TELEMETRY_MAX_ROWS: ${MISSION_TELEMETRY_MAX_ROWS:-}
      VWORLD_KEY: ${VWORLD_KEY:-}
      ROVER_MAX_WAYPOINT_DIST_M: ${ROVER_MAX_WAYPOINT_DIST_M:-}
      ROVER_MAX_SEGMENT_DIST_M: ${ROVER_MAX_SEGMENT_DIST_M:-}
      # 로버 전용 시크릿(선택). 설정 시 로버/perception/GPS 장비가 INTERNAL_SECRET 대신 이 값으로
      # 인증할 수 있어(course 로버 라우트 한정) 필드 장비의 유출 반경이 좁혀진다. course와 caddy에만
      # 주입한다(common-env에 넣으면 전 서비스로 퍼져 스코핑이 무의미).
      ROVER_SECRET: ${ROVER_SECRET:-}
    volumes:
      - ./course/data:/home/node/fsk-course/data
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:10000/api/health"]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  energymeter:
    image: ghcr.io/luftaquila/fsk-energymeter:latest
    container_name: fsk-energymeter
    security_opt:
      - label:disable
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - fsk-network

  calendar:
    image: ghcr.io/luftaquila/formula-student-korea/calendar:latest
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: calendar
        PORT: 11000
    container_name: fsk-calendar
    security_opt:
      - label:disable
    environment:
      <<: *common-env
    volumes:
      - ./calendar/data:/home/node/fsk-calendar/data
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:11000/api/health"]
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - fsk-network

  email:
    image: ghcr.io/luftaquila/formula-student-korea/email:latest
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: email
        PORT: 9900
    container_name: fsk-email
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      EMAIL_LOG_MAX_ROWS: ${EMAIL_LOG_MAX_ROWS:-}
    volumes:
      - ./email/data:/home/node/fsk-email/data
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9900/api/health"]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  auth:
    image: ghcr.io/luftaquila/formula-student-korea/auth:latest
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: auth
        PORT: 9100
    container_name: fsk-auth
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
    volumes:
      - ./auth/data:/home/node/fsk-auth/data
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9100/api/health"]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  filebrowser:
    image: ghcr.io/gtsteffaniak/filebrowser:beta
    container_name: fsk-filebrowser
    security_opt:
      - label:disable
    user: "0:0"
    volumes:
      - ./filebrowser/config.yaml:/home/filebrowser/data/config.yaml:ro
      - ./filebrowser/custom.css:/home/filebrowser/custom.css:ro
      - ./filebrowser/data:/home/filebrowser/data
      - ./filebrowser/data/files:/folder
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - fsk-network

  # Production - use traefik reverse proxy
  caddy:
    image: &caddy-image ghcr.io/luftaquila/formula-student-korea/caddy:latest
    build: &caddy-build
      context: .
      dockerfile: landing/Dockerfile
    container_name: fsk-caddy
    security_opt:
      - label:disable
    profiles:
      - production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fsk.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.fsk.entrypoints=websecure"
      - "traefik.http.routers.fsk.tls=true"
      - "traefik.http.routers.fsk.tls.certresolver=le"
      - "traefik.http.services.fsk.loadbalancer.server.port=9000"
    depends_on: &caddy-depends
      # auth만 service_healthy로 기다린다 — 모든 서비스가 auth로 사용자 검증을 하므로 auth가
      # 죽으면 어차피 전면 장애다. 나머지 백엔드는 service_started(기동까지만): 이렇게 하면 단일
      # 백엔드의 헬스 크래시루프(불량 마이그레이션·OOM 등)가 caddy 재생성을 무한 대기시켜 정상
      # 서비스까지 전면 outage로 번지는 것을 막는다. 개별 미준비 백엔드는 콜드스타트 502로만
      # 잠깐 노출되고 곧 회복한다(restart: unless-stopped + 헬스체크). energymeter·filebrowser는
      # 외부 이미지라 헬스체크 자체가 없어 원래도 service_started.
      auth: { condition: service_healthy }
      competition: { condition: service_started }
      course: { condition: service_started }
      energymeter: { condition: service_started }
      calendar: { condition: service_started }
      email: { condition: service_started }
      filebrowser: { condition: service_started }
    restart: unless-stopped
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - ROVER_SECRET=${ROVER_SECRET:-}
      - TEST_SERVER=${TEST_SERVER:-}
    healthcheck:
      # caddy:alpine 이미지의 BusyBox wget으로 랜딩 페이지(:9000/)를 확인. 다른 서비스가
      # 이 caddy에 service_healthy로 의존할 수 있게 하고, 프록시가 살아있는지 검증한다.
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/"]
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - fsk-network
      - traefik

  # Local development - expose port 9000
  caddy-local:
    image: *caddy-image
    build: *caddy-build
    container_name: fsk-caddy-local
    profiles:
      - local
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - ROVER_SECRET=${ROVER_SECRET:-}
      - TEST_SERVER=${TEST_SERVER:-}
    ports:
      - "0.0.0.0:9000:9000"
    depends_on: *caddy-depends
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/"]
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - fsk-network

networks:
  fsk-network:
    driver: bridge
  traefik:
    external: true
