x-common-env: &common-env
  JWT_SECRET: ${JWT_SECRET}
  INTERNAL_SECRET: ${INTERNAL_SECRET}
  TEST_SERVER: ${TEST_SERVER:-}

x-common-healthcheck: &common-healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 5s

services:
  entry:
    image: ghcr.io/luftaquila/formula-student-korea/entry:latest
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: entry
        PORT: 9200
    container_name: fsk-entry
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      AUTH_SERVER: http://auth:9100
      DOCUMENTS_SERVER: http://documents:9700
      QUEUE_SERVER: http://queue:9300
    volumes:
      - ./entry/data:/home/node/fsk-entry/data
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9200/api/health"]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  course:
    image: ghcr.io/luftaquila/formula-student-korea/course:latest
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: course
        PORT: 10000
    container_name: fsk-course
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      AUTH_SERVER: http://auth:9100
    volumes:
      - ./course/data:/home/node/fsk-course/data
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:10000/api/health"]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  traffic:
    image: ghcr.io/luftaquila/formula-student-korea/traffic:latest
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: traffic
        PORT: 9500
    container_name: fsk-traffic
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      AUTH_SERVER: http://auth:9100
    volumes:
      - ./traffic/data:/home/node/fsk-traffic/data
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9500/api/health"]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  energymeter:
    image: ghcr.io/luftaquila/fsk-energymeter:latest
    container_name: fsk-energymeter
    security_opt:
      - label:disable
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - fsk-network

  queue:
    image: ghcr.io/luftaquila/formula-student-korea/queue:latest
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: queue
        PORT: 9300
    container_name: fsk-queue
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      ENTRY_SERVER: http://entry:9200
      AUTH_SERVER: http://auth:9100
      EMAIL_SERVER: http://email:9900
    volumes:
      - ./queue/data:/home/node/fsk-queue/data
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9300/api/health"]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  inspection:
    image: ghcr.io/luftaquila/formula-student-korea/inspection:latest
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: inspection
        PORT: 9400
    container_name: fsk-inspection
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      AUTH_SERVER: http://auth:9100
    volumes:
      - ./inspection/data:/home/node/fsk-inspection/data
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9400/api/health"]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  score:
    image: ghcr.io/luftaquila/formula-student-korea/score:latest
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: score
        PORT: 9600
    container_name: fsk-score
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      ENTRY_SERVER: http://entry:9200
      INSPECTION_SERVER: http://inspection:9400
      TRAFFIC_SERVER: http://traffic:9500
      AUTH_SERVER: http://auth:9100
    volumes:
      - ./score/data:/home/node/fsk-score/data
    depends_on:
      inspection:
        condition: service_healthy
      traffic:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9600/api/health"]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  calendar:
    image: ghcr.io/luftaquila/formula-student-korea/calendar:latest
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: calendar
        PORT: 11000
    container_name: fsk-calendar
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      AUTH_SERVER: http://auth:9100
    volumes:
      - ./calendar/data:/home/node/fsk-calendar/data
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:11000/api/health"]
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - fsk-network

  documents:
    image: ghcr.io/luftaquila/formula-student-korea/documents:latest
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: documents
        PORT: 9700
    container_name: fsk-documents
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      AUTH_SERVER: http://auth:9100
      ENTRY_SERVER: http://entry:9200
      EMAIL_SERVER: http://email:9900
      PUBLIC_URL: ${PUBLIC_URL}
    volumes:
      - ./documents/data:/home/node/fsk-documents/data
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9700/api/health"]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  email:
    image: ghcr.io/luftaquila/formula-student-korea/email:latest
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: email
        PORT: 9900
    container_name: fsk-email
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      AUTH_SERVER: http://auth:9100
    volumes:
      - ./email/data:/home/node/fsk-email/data
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9900/api/health"]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  auth:
    image: ghcr.io/luftaquila/formula-student-korea/auth:latest
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: auth
        PORT: 9100
    container_name: fsk-auth
    security_opt:
      - label:disable
    environment:
      <<: *common-env
      LOG_SERVICES: "entry:http://entry:9200,queue:http://queue:9300,inspection:http://inspection:9400,traffic:http://traffic:9500,score:http://score:9600,documents:http://documents:9700,calendar:http://calendar:11000,course:http://course:10000,email:http://email:9900"
      EMAIL_SERVER: http://email:9900
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
    volumes:
      - ./auth/data:/home/node/fsk-auth/data
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9100/api/health"]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fsk-network

  filebrowser:
    image: ghcr.io/gtsteffaniak/filebrowser:beta
    container_name: fsk-filebrowser
    security_opt:
      - label:disable
    user: "0:0"
    volumes:
      - ./filebrowser/config.yaml:/home/filebrowser/data/config.yaml:ro
      - ./filebrowser/custom.css:/home/filebrowser/custom.css:ro
      - ./filebrowser/data:/home/filebrowser/data
      - ./filebrowser/data/files:/folder
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - fsk-network

  # Production - use traefik reverse proxy
  caddy:
    image: &caddy-image ghcr.io/luftaquila/formula-student-korea/caddy:latest
    build: &caddy-build
      context: .
      dockerfile: landing/Dockerfile
    container_name: fsk-caddy
    security_opt:
      - label:disable
    profiles:
      - production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fsk.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.fsk.entrypoints=websecure"
      - "traefik.http.routers.fsk.tls=true"
      - "traefik.http.routers.fsk.tls.certresolver=le"
      - "traefik.http.services.fsk.loadbalancer.server.port=9000"
    depends_on: &caddy-depends
      - entry
      - course
      - traffic
      - energymeter
      - queue
      - inspection
      - score
      - documents
      - calendar
      - email
      - filebrowser
      - auth
    restart: unless-stopped
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - TEST_SERVER=${TEST_SERVER:-}
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - fsk-network
      - traefik

  # Local development - expose port 9000
  caddy-local:
    image: *caddy-image
    build: *caddy-build
    container_name: fsk-caddy-local
    profiles:
      - local
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - TEST_SERVER=${TEST_SERVER:-}
    ports:
      - "0.0.0.0:9000:9000"
    depends_on: *caddy-depends
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - fsk-network

networks:
  fsk-network:
    driver: bridge
  traefik:
    external: true
